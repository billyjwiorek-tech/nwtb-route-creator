<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWTB Delivery + Pickup Manager</title>
<style>
:root{--ink:#17202a;--blue:#1a73e8;--bg:#eef1f4;--bd:#d9dee4}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:72px;background:var(--ink);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:21px;margin:0}header .sub{font-size:12px;opacity:.85;margin-top:4px}
.tabs{height:58px;background:#fff;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:8px 14px;overflow:auto}
button,a.tab{border:1px solid #cbd3da;border-radius:8px;background:#eef1f4;color:var(--ink);font-weight:700;padding:10px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.frame{display:none;width:100%;height:calc(100vh - 130px);border:0;background:#fff}.frame.active{display:block}
.badge{background:#e8f1ff;color:#174ea6;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
@media(max-width:760px){header{height:auto;min-height:82px;align-items:flex-start;flex-direction:column}.frame{height:calc(100vh - 148px)}.tabs{height:66px}header h1{font-size:18px}}
</style>
</head>
<body>
<header><div><h1>NWTB DELIVERY + PICKUP MANAGER</h1><div class="sub">Dispatch • Pickups • Live Drivers • Delivery/Pickup Chat</div></div><span class="badge">OFFICE</span></header>
<div class="tabs">
<button id="bDispatch" class="active" onclick="show('dispatch')">DISPATCH / PICKUP MANAGER</button>
<button id="bTracker" onclick="show('tracker')">LIVE DRIVER TRACKER</button>
<button id="bDriver" onclick="show('driver')">DRIVER PHONE VIEW</button>
</div>
<iframe id="fDispatch" class="frame active" src="dispatch.html" title="NWTB Dispatch and Pickup Manager"></iframe>
<iframe id="fTracker" class="frame" src="tracker.html" title="NWTB Live Driver Tracker"></iframe>
<iframe id="fDriver" class="frame" src="driver.html" title="NWTB Driver Phone View"></iframe>
<script>
const MATRIX='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-route-matrix';
const KEY='sb_publishable_EqF-iooqhmngSG5BbzOxfQ_Vnf9Altc';
function show(which){
 const map={dispatch:['fDispatch','bDispatch'],tracker:['fTracker','bTracker'],driver:['fDriver','bDriver']};
 Object.values(map).forEach(([f,b])=>{document.getElementById(f).classList.remove('active');document.getElementById(b).classList.remove('active')});
 const [f,b]=map[which];document.getElementById(f).classList.add('active');document.getElementById(b).classList.add('active');
 history.replaceState(null,'','#'+which);
}
function installRouteMatrixFix(){
 const frame=document.getElementById('fDispatch');
 try{
  const w=frame.contentWindow;
  if(!w)return;
  w.roadMatrix=async function(points){
   const token=localStorage.getItem('nwtb_delivery_token')||'';
   const r=await fetch(MATRIX,{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'x-nwtb-session':token},body:JSON.stringify({points})});
   const j=await r.json().catch(()=>({error:'Invalid routing response'}));
   if(!r.ok)throw Error(j.error||'Routing service failed');
   if(!Array.isArray(j.durations)||!Array.isArray(j.distances))throw Error('Routing matrix unavailable');
   if(j.warning){
    const box=w.document.getElementById('routeResult');
    if(box)box.innerHTML='<span style="color:#9a6500;font-weight:700">'+j.warning+'</span>';
   }
   return j;
  };
 }catch(e){console.error('Route matrix patch failed',e)}
}
document.getElementById('fDispatch').addEventListener('load',installRouteMatrixFix);
const h=location.hash.replace('#','');if(['dispatch','tracker','driver'].includes(h))show(h);
</script>
</body>
</html>
