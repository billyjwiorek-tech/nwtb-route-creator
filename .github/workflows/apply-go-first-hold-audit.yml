name: Apply GO FIRST Hold Audit

on:
  push:
    paths:
      - '.github/workflows/apply-go-first-hold-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply GO FIRST deep audit
        run: python scripts/apply_go_first_hold_audit_20260928.py
      - name: Commit production audit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html navigation.js chat.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Apply completed GO FIRST hold audit"
          git push
