name: Upgrade Sales to Delivery Routing Engine

on:
  push:
    paths:
      - '.github/workflows/upgrade-sales-delivery-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply routing upgrade
        run: python scripts/upgrade_sales_delivery_routing.py
      - name: Commit routing upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation.js index.html app.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use Delivery road-matrix engine for Sales routing"
          git push
