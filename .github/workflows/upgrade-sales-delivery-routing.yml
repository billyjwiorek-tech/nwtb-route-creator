name: Upgrade Sales to Delivery Routing Engine

on:
  push:
    paths:
      - '.github/workflows/upgrade-sales-delivery-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable built-in Sales turn-by-turn
        run: python scripts/enable_sales_builtin_navigation.py
      - name: Commit built-in Sales navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Wire built-in turn-by-turn navigation into Sales"
          git push
