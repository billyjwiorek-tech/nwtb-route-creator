name: NWTB return lifecycle
on:
  push:
    branches: [main, fix/nwtb-return-leg-lifecycle-20261020, fix/nwtb-driver-chat-seen-20261020, feat/nwtb-driver-presence-20261020, feat/nwtb-live-map-search-20261021]
    paths: ['driver-*.html', 'driver-*.js', '*.webmanifest', 'nwtb-driver-sw.js', 'dispatch-*.js', 'tracker*.html', 'tracker*.js', 'office-*.js', 'office-*.mjs', 'unified-search.js', 'custom-master-search.js', 'driver-*.svg', 'delivery-*.html', 'dispatch*.html', 'dispatch-route-admin-native.js', 'dispatch-chat-live.js', 'supabase/**', 'tests/**', '.github/workflows/nwtb-return-lifecycle.yml']
  pull_request:
    paths: ['driver-*.html', 'driver-*.js', '*.webmanifest', 'nwtb-driver-sw.js', 'dispatch-*.js', 'tracker*.html', 'tracker*.js', 'office-*.js', 'office-*.mjs', 'unified-search.js', 'custom-master-search.js', 'driver-*.svg', 'delivery-*.html', 'dispatch*.html', 'dispatch-route-admin-native.js', 'supabase/**', 'tests/**', '.github/workflows/nwtb-return-lifecycle.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIXTURE_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests
      - name: Check Office QR popup JavaScript syntax
        run: node --check office-driver-qr.js
      - name: Check Office map module syntax
        run: |
          node --check office-map-live.mjs
          node --check tracker-driver-status.js
          node --check unified-search.js
          node --check custom-master-search.js
          node --check supabase/functions/nwtb-office-map/index.ts
          node --check supabase/functions/nwtb-office-map/handler.mjs
          node --check supabase/functions/nwtb-office-map/policy.mjs
      - run: npm --prefix tests test
      - name: Validate return migration in disposable database
        run: |
          route_migration_path=$(find supabase/migrations -maxdepth 1 -type f -name '*_preserve_return_leg_until_confirmation.sql' -print -quit)
          test -n "$route_migration_path"
          printf 'RETURN_MIGRATION_PATH=%s\n' "$route_migration_path"
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/route-return-fixture-schema.sql
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$route_migration_path"
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/route-return-db.test.sql
      - name: Validate registration and push storage in disposable database
        run: |
          driver_migration_path=$(find supabase/migrations -maxdepth 1 -type f -name '*_add_driver_and_phone_push.sql' -print -quit)
          test -n "$driver_migration_path"
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/driver-presence-fixture-schema.sql
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$driver_migration_path"
          psql "$FIXTURE_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/driver-presence-db.test.sql
  production-bytes:
    if: github.ref == 'refs/heads/main'
    needs: lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public Pages assets match this commit
        run: node tests/verify-nwtb-return-production.cjs
