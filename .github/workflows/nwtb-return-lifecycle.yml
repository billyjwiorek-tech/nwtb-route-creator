name: NWTB return lifecycle
on:
  push:
    branches: [main, fix/nwtb-return-leg-lifecycle-20261020]
    paths: ['driver-*.html', 'driver-*.js', 'tracker*.html', 'tracker*.js', 'office-pause-alerts.js', 'delivery-*.html', 'dispatch*.html', 'dispatch-route-admin-native.js', 'supabase/**', 'tests/**', '.github/workflows/nwtb-return-lifecycle.yml']
  pull_request:
    paths: ['driver-*.html', 'driver-*.js', 'tracker*.html', 'tracker*.js', 'office-pause-alerts.js', 'delivery-*.html', 'dispatch*.html', 'dispatch-route-admin-native.js', 'supabase/**', 'tests/**', '.github/workflows/nwtb-return-lifecycle.yml']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIXTURE_DATABASE_URL: postgresql://postgres:fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests
      - run: npm --prefix tests test
      - name: Check migration CLI
        run: |
          npx --yes supabase@2.121.0 --help
          npx --yes supabase@2.121.0 migration --help
          npx --yes supabase@2.121.0 migration new --help
