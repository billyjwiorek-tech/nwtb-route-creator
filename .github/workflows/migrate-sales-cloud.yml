name: Migrate Sales Frontend to Private Cloud

on:
  push:
    paths:
      - '.github/workflows/migrate-sales-cloud.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sales frontend
        run: python scripts/migrate_sales_frontend_to_cloud.py
      - name: Commit cloud migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          git commit -m "Require Sales login and load private accounts from Supabase"
          git push
