name: NWTB driver presence preparation
on:
  push:
    branches: [feat/nwtb-driver-presence-20261020]
    paths: ['.github/workflows/nwtb-driver-presence-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned phone-push fixture dependencies
        run: |
          npm install --prefix tests --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact web-push@3.6.7
          node -e "const fs=require('node:fs');console.log('NWTB_LOCK_START'+JSON.stringify(JSON.parse(fs.readFileSync('tests/package-lock.json','utf8')))+'NWTB_LOCK_END')"
