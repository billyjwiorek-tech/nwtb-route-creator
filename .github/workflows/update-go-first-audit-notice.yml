name: Update GO FIRST Audit Notice

on:
  push:
    paths:
      - '.github/workflows/update-go-first-audit-notice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_go_first_audit_notice.py
      - name: Commit audit notice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html navigation.js chat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update GO FIRST audit results to 55 approved 11 hold"
          git push
