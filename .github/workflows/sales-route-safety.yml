name: Sales route safety
on:
  push:
    paths: ['sales-*.js', 'chat.js', 'navigation.js', 'index.html', 'app.html', 'supabase/functions/**', 'tests/sales-*.test.cjs', '.github/workflows/sales-route-safety.yml']
  pull_request:
    paths: ['sales-*.js', 'chat.js', 'navigation.js', 'index.html', 'app.html', 'supabase/functions/**', 'tests/sales-*.test.cjs', '.github/workflows/sales-route-safety.yml']
jobs:
  sales-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: node --test tests/sales-route-safety.test.cjs tests/sales-route-preview.test.cjs tests/sales-navigation.test.cjs
