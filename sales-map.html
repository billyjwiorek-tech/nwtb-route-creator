<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>NWTB Live Sales Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#18864b;--r:#c62828;--p:#7b2cbf;--o:#df7b16;--b:#2764c7;--ink:#17202a;--bd:#d9dee4}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#f4f6f8}
header{background:#17202a;color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:20px;margin:0}.topActions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;border:0;border-radius:8px;padding:10px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn.light{background:#fff;color:#17202a}.btn.blue{background:#1a73e8;color:#fff}
.toolbar{background:#fff;border-bottom:1px solid var(--bd);padding:10px 12px;display:grid;grid-template-columns:1.4fr .8fr auto;gap:8px;align-items:end}
label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #bbc4cc;border-radius:8px;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#eef2f6;border:1px solid #d5dde5;border-radius:8px;padding:8px 10px;font-size:12px}.stat b{font-size:16px}
#map{height:calc(100vh - 153px);min-height:440px}
.legend{background:#fff;padding:9px 10px;border-radius:8px;box-shadow:0 1px 8px #0002;line-height:1.55;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.hold{border:2px solid #c62828;background:#777}
.popupTitle{font-weight:800;font-size:15px;margin-bottom:4px}.small{font-size:12px;color:#5e6872;line-height:1.45}.pill{display:inline-block;border-radius:999px;padding:3px 7px;color:#fff;font-size:10px;font-weight:800;margin:3px 3px 5px 0}.warn{color:#a11212;font-weight:800}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .stats{grid-column:1/-1}#map{height:calc(100vh - 220px)}}
</style>
</head>
<body>
<header>
  <div><h1>NWTB BOLINGBROOK — LIVE SALES MAP</h1><div style="font-size:12px;opacity:.85">Live Supabase Sales database • Route-approved stops shown by default</div></div>
  <div class="topActions"><a class="btn light" href="./">← ROUTE CREATOR</a><button class="btn blue" id="fitBtn">FIT VISIBLE PINS</button></div>
</header>
<div class="toolbar">
  <div><label>SEARCH BUSINESS / ADDRESS / CUSTOMER #</label><input id="search" placeholder="Type a business, address, or customer number"></div>
  <div><label>SHOW</label><select id="statusFilter"><option value="approved">ROUTE APPROVED</option><option value="hold">HOLD REVIEW</option><option value="all">ALL INCLUDED</option></select></div>
  <div class="stats"><div class="stat"><b id="approvedCount">—</b> Approved</div><div class="stat"><b id="holdCount">—</b> HOLD</div><div class="stat"><b id="visibleCount">—</b> Visible</div></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./sales-route-policy.js?v=20261006MAP1"></script>
<script src="./sales-cloud-auth.js?v=20261006MAP1"></script>
<script>
const map=L.map('map',{zoomControl:true}).setView([41.69,-88.08],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const group=L.layerGroup().addTo(map);
let accounts=[];
const $=id=>document.getElementById(id);
const asBool=v=>v===true||v==='true'||v===1||v==='1';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function isApproved(a){return asBool(a.finalRouteApproved)}
function layerColor(a){
  if(!isApproved(a))return '#777777';
  if(a.layer==='GO FIRST')return a.broadType==='PROSPECT'?'#c62828':'#18864b';
  if(a.layer==='VERIFIED PROSPECTS')return '#7b2cbf';
  if(a.layer==='WIN-BACK CUSTOMERS')return '#df7b16';
  return '#2764c7';
}
function layerLabel(a){
  if(a.layer==='GO FIRST')return a.broadType==='PROSPECT'?'GO FIRST — NEW BUSINESS':'GO FIRST — EXISTING';
  if(a.layer==='VERIFIED PROSPECTS')return 'VERIFIED PROSPECT';
  if(a.layer==='WIN-BACK CUSTOMERS')return 'WIN-BACK';
  return 'ACTIVE CUSTOMER';
}
function gmaps(a){
  const lat=Number(a.lat),lon=Number(a.lon);
  const q=Number.isFinite(lat)&&Number.isFinite(lon)?lat.toFixed(6)+','+lon.toFixed(6):(a.address||a.name||'');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}
function popup(a){
  const approved=isApproved(a), color=layerColor(a), status=String(a.finalLocationAuditStatus||'');
  return '<div class="popupTitle">'+esc(a.name)+'</div>'+
    '<span class="pill" style="background:'+color+'">'+esc(layerLabel(a))+'</span>'+
    '<span class="pill" style="background:'+(approved?'#18864b':'#c62828')+'">'+(approved?'ROUTE APPROVED':'HOLD')+'</span>'+
    '<div class="small"><b>Address:</b> '+esc(a.address||'—')+'<br><b>Customer #:</b> '+esc(a.customerNumber||'—')+
    (status?'<br><b>Audit:</b> '+esc(status):'')+
    (!approved&&a.finalLocationAuditReason?'<br><span class="warn">'+esc(a.finalLocationAuditReason)+'</span>':'')+
    '</div><div style="margin-top:8px"><a class="btn blue" style="padding:7px 9px;font-size:12px" target="_blank" rel="noopener" href="'+gmaps(a)+'">OPEN IN GOOGLE MAPS</a></div>';
}
function matches(a,q){
  if(!q)return true;
  const hay=[a.name,a.address,a.customerNumber,a.finalLocationAuditStatus,a.layer].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function render(){
  group.clearLayers();
  const mode=$('statusFilter').value,q=$('search').value.trim();
  const bounds=[];
  let visible=0;
  accounts.forEach(a=>{
    if(a.finalIncluded===false)return;
    const approved=isApproved(a);
    if(mode==='approved'&&!approved)return;
    if(mode==='hold'&&approved)return;
    if(!matches(a,q))return;
    const lat=Number(a.lat),lon=Number(a.lon);
    if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
    const c=layerColor(a);
    const marker=L.circleMarker([lat,lon],{radius:approved?7:6,color:approved?'#ffffff':'#c62828',weight:approved?1.5:2,fillColor:c,fillOpacity:.9});
    marker.bindPopup(popup(a),{maxWidth:360}).addTo(group);
    bounds.push([lat,lon]); visible++;
  });
  $('visibleCount').textContent=visible;
  if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:13});
}
function fitVisible(){
  const b=[];group.eachLayer(x=>{if(x.getLatLng){const p=x.getLatLng();b.push([p.lat,p.lng])}});
  if(b.length)map.fitBounds(b,{padding:[24,24],maxZoom:13});
}
const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=
'<b>PIN COLORS</b><br>'+
'<span class="dot" style="background:#18864b"></span>GO FIRST existing<br>'+
'<span class="dot" style="background:#c62828"></span>GO FIRST new business<br>'+
'<span class="dot" style="background:#7b2cbf"></span>Verified prospect<br>'+
'<span class="dot" style="background:#df7b16"></span>Win-Back<br>'+
'<span class="dot" style="background:#2764c7"></span>Active customer<br>'+
'<span class="dot hold"></span>HOLD review';return d};legend.addTo(map);
$('statusFilter').addEventListener('change',render);
$('search').addEventListener('input',render);
$('fitBtn').addEventListener('click',fitVisible);
(async()=>{
  accounts=await window.nwtbLoadSalesAccounts();
  const included=accounts.filter(a=>a.finalIncluded!==false);
  $('approvedCount').textContent=included.filter(isApproved).length;
  $('holdCount').textContent=included.filter(a=>!isApproved(a)).length;
  render();
})();
</script>
</body>
</html>
