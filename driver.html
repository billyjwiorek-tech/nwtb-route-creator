<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWTB Driver Route</title></head><body><div style="font-family:Arial,sans-serif;padding:24px">Loading NWTB Driver Route…</div><script>
(async()=>{
 const base='https://raw.githubusercontent.com/billyjwiorek-tech/nwtb-route-creator/58a2bfe685bb91bd5b957321b0a9f363b33b93ee/driver.html';
 try{
  const r=await fetch(base,{cache:'no-store'});
  if(!r.ok)throw Error('Could not load Driver Route.');
  let html=await r.text();
  html=html.replace('</body>','<script src="driver-custom-route.js?v=20260922-1925"><\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;color:#b42318"><b>Driver Route failed to load.</b><br>'+e.message+'</div>'}
})();
</script></body></html>
