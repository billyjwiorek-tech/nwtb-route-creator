<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWTB Driver Route</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#17202a;color:#fff;padding:18px}.wrap{max-width:850px;margin:18px auto;padding:0 14px}.panel,.stop{background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:15px;margin-bottom:12px}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;background:#17202a;color:#fff;text-decoration:none;display:inline-block}.blue{background:#1a73e8}.green{background:#18864b}.red{background:#c62828}.ghost{background:#eef1f4;color:#17202a}select{width:100%;padding:12px;border:1px solid #bbc4cc;border-radius:8px;font-size:16px}.small{font-size:12px;color:#5f6b76}.warn{color:#a33;font-weight:700}.ok{color:#176b3a;font-weight:700}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef1f4;font-size:11px;font-weight:700}</style></head><body><header><h1 style="margin:0">NWTB DRIVER ROUTE</h1><div>No PIN required • Live location while route page is open</div></header><div class="wrap"><div id="boot" class="panel">Opening driver page…</div><div id="app" style="display:none"><div class="panel"><label><b>Who is driving this phone?</b></label><select id="driver" onchange="driverChanged()"></select><p id="track" class="small">Select your name. Tracking starts only after you tap START ROUTE.</p><button class="btn" onclick="loadRoutes()">LOAD MY ROUTES</button></div><div id="routes"></div></div></div><script>const CHAT='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-chat',API='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-delivery',TRACK='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-delivery-tracking',KEY='sb_publishable_EqF-iooqhmngSG5BbzOxfQ_Vnf9Altc';let token='',drivers=[],driver='',route='',watchId=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function post(url,p,auth=true){const h={'content-type':'application/json','apikey':KEY};if(auth)h['x-nwtb-session']=token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(p)}),j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function boot(){try{token=localStorage.getItem('nwtb_delivery_token')||'';if(!token){const j=await post(CHAT,{action:'delivery_guest_start'},false);token=j.token;localStorage.setItem('nwtb_delivery_token',token)}const d=await post(API,{action:'drivers'});drivers=(d.drivers||[]).filter(x=>x.employee_number!=='9998');$('driver').innerHTML='<option value="">-- Select Driver --</option>'+drivers.map(x=>`<option value="${esc(x.employee_number)}">${esc(x.display_name)} (${esc(x.employee_number)})</option>`).join('');const saved=localStorage.getItem('nwtb_delivery_driver')||'';if(saved&&drivers.some(x=>x.employee_number===saved)){$('driver').value=saved;driver=saved} $('boot').style.display='none';$('app').style.display='block';if(driver)loadRoutes()}catch(e){$('boot').innerHTML='<span class="warn">'+esc(e.message)+'</span>'}}function driverChanged(){driver=$('driver').value;localStorage.setItem('nwtb_delivery_driver',driver);stopTracking();$('track').textContent='Tracking starts only after you tap START ROUTE.';loadRoutes()}async function loadRoutes(){if(!driver){$('routes').innerHTML='<div class="panel warn">Select your name first.</div>';return}try{const j=await post(TRACK,{action:'driver_routes',driver_employee_number:driver});$('routes').innerHTML=(j.routes||[]).map(r=>`<div class="panel"><b>${esc(r.route_date)} • ${esc(r.depot)} • ${esc(r.wave)}</b><br><span class="small">${esc(r.status)}${r.estimated_miles?' • '+Number(r.estimated_miles).toFixed(1)+' mi':''}</span><br><button class="btn blue" style="margin-top:8px" onclick="openRoute('${r.id}')">OPEN ROUTE</button></div>`).join('')||'<div class="panel">No planned or active route assigned.</div>'}catch(e){$('routes').innerHTML='<div class="panel warn">'+esc(e.message)+'</div>'}}async function openRoute(id){route=id;try{const j=await post(API,{action:'route_get',route_id:id}),stops=j.stops||[];$('routes').innerHTML=`<div class="panel"><button class="btn ghost" onclick="loadRoutes()">← BACK</button> <button class="btn green" onclick="startRoute('${id}')">START ROUTE + LIVE TRACKING</button></div>`+stops.map(s=>{const o=s.delivery_orders||{},nav='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent((o.customer_name||'')+', '+(o.address||''))+'&travelmode=driving&dir_action=navigate';return `<div class="stop"><b>STOP ${s.stop_sequence}: ${esc(o.customer_name)}</b> <span class="pill">${esc(o.stop_type||'STOP')}</span><br>${esc(o.address)}<br><span class="small">${esc(o.notes||'')}</span><br><a class="btn blue" target="_blank" href="${nav}">NAVIGATE</a> ${s.status==='PENDING'?`<button class="btn green" onclick="finish('${s.id}','DELIVERED')">COMPLETE</button> <button class="btn red" onclick="finish('${s.id}','NOT_DELIVERED')">NOT COMPLETED</button>`:`<b>${esc(s.status)}</b>`}</div>`}).join('')}catch(e){alert(e.message)}}async function startRoute(id){try{await post(TRACK,{action:'route_start_driver',route_id:id,driver_employee_number:driver});route=id;startTracking();openRoute(id)}catch(e){alert(e.message)}}async function finish(id,status){let note='';if(status==='NOT_DELIVERED')note=prompt('Reason / note:')||'';try{await post(TRACK,{action:'stop_status_driver',driver_employee_number:driver,stop_id:id,status,note});openRoute(route)}catch(e){alert(e.message)}}function startTracking(){if(!navigator.geolocation){$('track').innerHTML='<span class="warn">Location is not supported on this phone/browser.</span>';return}if(watchId!==null)return;$('track').textContent='Requesting location permission…';watchId=navigator.geolocation.watchPosition(async p=>{const c=p.coords;$('track').innerHTML='<span class="ok">LIVE TRACKING ON</span> • last update '+new Date().toLocaleTimeString()+' • accuracy '+Math.round(c.accuracy||0)+' m';try{await post(TRACK,{action:'location_update',driver_employee_number:driver,route_id:route,lat:c.latitude,lon:c.longitude,accuracy_m:c.accuracy,heading_deg:c.heading,speed_mps:c.speed,captured_at:new Date(p.timestamp).toISOString()})}catch(e){$('track').innerHTML='<span class="warn">Location found but upload failed: '+esc(e.message)+'</span>'}},e=>{$('track').innerHTML='<span class="warn">Tracking off: '+esc(e.message)+'. Allow location permission and tap START ROUTE again.</span>';stopTracking()},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}function stopTracking(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}boot();</script></body></html>
