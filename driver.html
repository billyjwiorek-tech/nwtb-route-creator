<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWTB Driver Route</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#17202a;color:#fff;padding:18px}.wrap{max-width:850px;margin:18px auto;padding:0 14px}.panel,.stop{background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:15px;margin-bottom:12px}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer;background:#17202a;color:#fff;text-decoration:none;display:inline-block}.blue{background:#1a73e8}.green{background:#18864b}.red{background:#c62828}.amber{background:#b54708}.ghost{background:#eef1f4;color:#17202a}.return{background:#0b8043}select{width:100%;padding:12px;border:1px solid #bbc4cc;border-radius:8px;font-size:16px}.small{font-size:12px;color:#5f6b76}.warn{color:#a33;font-weight:700}.ok{color:#176b3a;font-weight:700}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef1f4;font-size:11px;font-weight:700}.alertbar{display:none;position:sticky;top:0;z-index:999;padding:16px 18px;text-align:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 5px 20px rgba(0,0,0,.24)}.alertbar.show{display:block}.alertbar.add{background:#067647}.alertbar.remove{background:#b42318}.alertbar .sub{font-size:12px;font-weight:700;margin-top:4px}.alertstatus{margin-top:10px;padding:10px 12px;border-radius:9px;background:#f8fafc;border:1px solid #d9dee4}.stop.changed{outline:3px solid #f79009}</style></head><body><div id="routeAlert" class="alertbar"></div><header><h1 style="margin:0">NWTB DRIVER ROUTE</h1><div>No PIN required • Live location while route page is open • Every route returns to NW Trucks Bolingbrook</div></header><div class="wrap"><div id="boot" class="panel">Opening driver page…</div><div id="app" style="display:none"><div class="panel"><label><b>Who is driving?</b></label><select id="driver" onchange="driverChanged()"></select><p id="track" class="small">Select your name. Tracking starts only after you tap START ROUTE.</p><button class="btn" onclick="loadRoutes()">LOAD MY ROUTES</button> <button id="alertsBtn" class="btn amber" onclick="enableAlerts(true)">ENABLE DRIVER ALERTS</button><div id="alertStatus" class="alertstatus small">Route-change alerts are not enabled on this page yet.</div></div><div id="routes"></div></div></div><script>const CHAT='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-chat',API='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-delivery',TRACK='https://ufnjyidhxuytrmbjzgtu.supabase.co/functions/v1/nwtb-delivery-tracking',KEY='sb_publishable_EqF-iooqhmngSG5BbzOxfQ_Vnf9Altc';const HOME={name:'Northwest Trucks - Bolingbrook',address:'201 S W Frontage Rd, Bolingbrook, IL 60440'};let token='',drivers=[],driver='',route='',watchId=null,changeTimer=null,audioCtx=null,alertsReady=false,wakeLock=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function post(url,p,auth=true){const h={'content-type':'application/json','apikey':KEY};if(auth)h['x-nwtb-session']=token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(p)}),j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw Error(j.error||'Request failed');return j}function fullRouteLinks(stops){const arr=stops.map(o=>({name:o.customer_name||'Stop',address:o.address||''})),enc=x=>encodeURIComponent(`${x.name}, ${x.address}`),out=[];if(!arr.length)return out;if(arr.length<=9){out.push({label:'OPEN FULL ROUTE + RETURN TO NWTB BOLINGBROOK',url:`https://www.google.com/maps/dir/?api=1&origin=${enc(HOME)}&destination=${enc(HOME)}&travelmode=driving&dir_action=navigate&waypoints=${arr.map(enc).join('%7C')}`});return out}let i=0,start=HOME,part=1;while(i<arr.length){const take=Math.min(9,arr.length-i),chunk=arr.slice(i,i+take),last=i+take>=arr.length,dest=last?HOME:chunk[chunk.length-1],wps=last?chunk:chunk.slice(0,-1);out.push({label:`ROUTE PART ${part}${last?' + RETURN TO NWTB BOLINGBROOK':''}`,url:`https://www.google.com/maps/dir/?api=1&origin=${enc(start)}&destination=${enc(dest)}&travelmode=driving&dir_action=navigate${wps.length?'&waypoints='+wps.map(enc).join('%7C'):''}`});start=dest;i+=take;part++}return out}async function boot(){try{token=localStorage.getItem('nwtb_delivery_token')||'';if(!token){const j=await post(CHAT,{action:'delivery_guest_start'},false);token=j.token;localStorage.setItem('nwtb_delivery_token',token)}const d=await post(API,{action:'drivers'});drivers=(d.drivers||[]).filter(x=>x.employee_number!=='9998');$('driver').innerHTML='<option value="">-- Select Driver --</option>'+drivers.map(x=>`<option value="${esc(x.employee_number)}">${esc(x.display_name)} (${esc(x.employee_number)})</option>`).join('');const saved=localStorage.getItem('nwtb_delivery_driver')||'';if(saved&&drivers.some(x=>x.employee_number===saved)){$('driver').value=saved;driver=saved}$('boot').style.display='none';$('app').style.display='block';updateAlertStatus();if(driver)loadRoutes()}catch(e){$('boot').innerHTML='<span class="warn">'+esc(e.message)+'</span>'}}function driverChanged(){driver=$('driver').value;localStorage.setItem('nwtb_delivery_driver',driver);stopTracking();stopChangePolling();route='';$('track').textContent='Tracking starts only after you tap START ROUTE.';loadRoutes()}function updateAlertStatus(){const n=('Notification'in window)?Notification.permission:'unsupported';$('alertStatus').innerHTML=alertsReady?'<span class="ok">DRIVER ALERTS ON</span> • sound + vibration enabled'+(n==='granted'?' • browser notifications allowed':''):'Route-change alerts are not enabled on this page yet. Tap <b>ENABLE DRIVER ALERTS</b> or start the route.';$('alertsBtn').textContent=alertsReady?'DRIVER ALERTS ON':'ENABLE DRIVER ALERTS';$('alertsBtn').className='btn '+(alertsReady?'green':'amber')}async function enableAlerts(test=false){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')await audioCtx.resume()}alertsReady=true;localStorage.setItem('nwtb_driver_alerts','1');if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}updateAlertStatus();if(test)playAlertTone(false)}catch{alertsReady=true;updateAlertStatus()}}function playAlertTone(urgent=true){if(!alertsReady)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(!audioCtx)return;const t=audioCtx.currentTime;[[0,880,.18],[.24,urgent?1100:660,.22]].forEach(([off,f,d])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.0001,t+off);g.gain.exponentialRampToValueAtTime(.22,t+off+.01);g.gain.exponentialRampToValueAtTime(.0001,t+off+d);o.connect(g);g.connect(audioCtx.destination);o.start(t+off);o.stop(t+off+d+.02)})}catch{}}function showRouteAlert(ev){const added=ev.event_type==='STOP_ADDED_ACTIVE',bar=$('routeAlert');bar.className='alertbar show '+(added?'add':'remove');bar.innerHTML=(added?'STOP ADDED TO YOUR ROUTE':'STOP REMOVED FROM YOUR ROUTE')+'<div class="sub">'+esc(ev.note||'Your route was updated by Dispatch.')+'</div>';playAlertTone(true);if(navigator.vibrate)navigator.vibrate(added?[250,120,250,120,450]:[500,180,500]);if('Notification'in window&&Notification.permission==='granted'){try{new Notification(added?'NWTB — STOP ADDED':'NWTB — STOP REMOVED',{body:ev.note||'Dispatch changed your route.',tag:'nwtb-route-'+route,renotify:true})}catch{}}setTimeout(()=>{bar.className='alertbar'},9000)}async function loadRoutes(){stopChangePolling();if(!driver){$('routes').innerHTML='<div class="panel warn">Select your name first.</div>';return}try{const j=await post(TRACK,{action:'driver_routes',driver_employee_number:driver});$('routes').innerHTML=(j.routes||[]).map(r=>`<div class="panel"><b>${esc(r.route_date)} • BOLINGBROOK START/RETURN • ${esc(r.wave)}</b><br><span class="small">${esc(r.status)}${r.estimated_miles?' • '+Number(r.estimated_miles).toFixed(1)+' mi':''}</span><br><button class="btn blue" style="margin-top:8px" onclick="openRoute('${r.id}')">OPEN ROUTE</button></div>`).join('')||'<div class="panel">No planned or active route assigned.</div>'}catch(e){$('routes').innerHTML='<div class="panel warn">'+esc(e.message)+'</div>'}}async function openRoute(id,fromChange=false){route=id;try{const j=await post(API,{action:'route_get',route_id:id}),stops=j.stops||[],routeStops=stops.map(s=>s.delivery_orders||{}),links=fullRouteLinks(routeStops);$('routes').innerHTML=`<div class="panel"><button class="btn ghost" onclick="loadRoutes()">← BACK</button> <button class="btn green" onclick="startRoute('${id}')">START ROUTE + LIVE TRACKING</button><div style="margin-top:10px"><b>START / RETURN:</b> Northwest Trucks - Bolingbrook<br><span class="small">201 S W Frontage Rd, Bolingbrook, IL 60440</span></div><div style="margin-top:10px">${links.map(x=>`<a class="btn return" target="_blank" href="${x.url}" style="margin:4px 4px 4px 0">${x.label}</a>`).join('')}</div></div>`+stops.map(s=>{const o=s.delivery_orders||{},nav='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent((o.customer_name||'')+', '+(o.address||''))+'&travelmode=driving&dir_action=navigate';return `<div class="stop"><b>STOP ${s.stop_sequence}: ${esc(o.customer_name)}</b> <span class="pill">${esc(o.stop_type||'STOP')}</span><br>${esc(o.address)}<br><span class="small">${esc(o.notes||'')}</span><br><a class="btn blue" target="_blank" href="${nav}">NAVIGATE</a> ${s.status==='PENDING'?`<button class="btn green" onclick="finish('${s.id}','DELIVERED')">COMPLETE</button> <button class="btn red" onclick="finish('${s.id}','NOT_DELIVERED')">NOT COMPLETED</button>`:`<b>${esc(s.status)}</b>`}</div>`}).join('');startChangePolling(id);if(!fromChange&&localStorage.getItem('nwtb_driver_alerts')==='1')$('alertStatus').innerHTML='Tap <b>ENABLE DRIVER ALERTS</b> once on this page to restore sound after reopening the browser.'}catch(e){alert(e.message)}}async function startRoute(id){await enableAlerts(false);try{await post(TRACK,{action:'route_start_driver',route_id:id,driver_employee_number:driver});route=id;startTracking();requestWakeLock();openRoute(id)}catch(e){alert(e.message)}}async function finish(id,status){let note='';if(status==='NOT_DELIVERED')note=prompt('Reason / note:')||'';try{await post(TRACK,{action:'stop_status_driver',driver_employee_number:driver,stop_id:id,status,note});openRoute(route)}catch(e){alert(e.message)}}function startChangePolling(id){stopChangePolling();changeTimer=setInterval(()=>checkRouteChanges(id),5000);checkRouteChanges(id)}function stopChangePolling(){if(changeTimer){clearInterval(changeTimer);changeTimer=null}}async function checkRouteChanges(id){if(!id||id!==route||!driver)return;const key='nwtb_route_event_'+id,last=Number(localStorage.getItem(key)||0);try{const j=await post(TRACK,{action:'route_changes',driver_employee_number:driver,route_id:id,after_id:last}),events=j.events||[];if(!events.length)return;for(const ev of events){showRouteAlert(ev);localStorage.setItem(key,String(ev.id))}await openRoute(id,true)}catch(e){console.warn('Route change check failed',e)}}function startTracking(){if(!navigator.geolocation){$('track').innerHTML='<span class="warn">Location is not supported on this phone/browser.</span>';return}if(watchId!==null)return;$('track').textContent='Requesting location permission…';watchId=navigator.geolocation.watchPosition(async p=>{const c=p.coords;$('track').innerHTML='<span class="ok">LIVE TRACKING ON</span> • last update '+new Date().toLocaleTimeString()+' • accuracy '+Math.round(c.accuracy||0)+' m';try{await post(TRACK,{action:'location_update',driver_employee_number:driver,route_id:route,lat:c.latitude,lon:c.longitude,accuracy_m:c.accuracy,heading_deg:c.heading,speed_mps:c.speed,captured_at:new Date(p.timestamp).toISOString()})}catch(e){$('track').innerHTML='<span class="warn">Location found but upload failed: '+esc(e.message)+'</span>'}},e=>{$('track').innerHTML='<span class="warn">Tracking off: '+esc(e.message)+'. Allow location permission and tap START ROUTE again.</span>';stopTracking()},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}function stopTracking(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}async function requestWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId!==null)requestWakeLock()});boot();</script></body></html>
