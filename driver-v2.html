<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>NWTB Driver — Redirecting</title>
<style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#182230;margin:0;padding:28px}.box{max-width:520px;margin:80px auto;background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;text-align:center}.box h1{margin:0 0 8px}.box p{color:#667085}.btn{display:inline-block;margin-top:12px;background:#175cd3;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:900}</style>
</head>
<body>
<div class="box"><h1>NWTB DRIVER</h1><p>This older Driver QR/link now forwards to the current production Driver app.</p><a id="go" class="btn" href="driver-live.html">OPEN CURRENT DRIVER APP</a></div>
<script>
(()=>{
 const target='driver-live.html'+(location.search||'')+(location.hash||'');
 document.getElementById('go').href=target;
 setTimeout(()=>location.replace(target),80);
})();
</script>
</body>
</html>
