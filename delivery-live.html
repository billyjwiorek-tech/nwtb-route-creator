<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWTB Delivery Operations — Live Tracking</title>
<style>html,body{margin:0;min-height:100%;background:#f4f6f8;font-family:Arial,sans-serif}.boot{padding:24px;color:#17202a}.err{color:#b42318}.liveBadge{position:fixed;right:26px;top:24px;z-index:9999;border:1px solid #86efac;background:#ecfdf3;color:#067647;border-radius:999px;padding:7px 11px;font:900 10px/1 Arial,sans-serif;letter-spacing:.35px;box-shadow:0 3px 10px rgba(16,24,40,.08);pointer-events:none}@media(max-width:720px){.liveBadge{right:10px;top:13px;font-size:9px;padding:6px 8px}}</style>
</head>
<body>
<div class="boot" id="boot">Loading NWTB Delivery Operations — Live Tracking Edition…</div>
<script>
(async()=>{
 const base='https://raw.githubusercontent.com/billyjwiorek-tech/nwtb-route-creator/ae9b6d077fd6dfc2a3a29106bf8fbcded2a13938/delivery.html';
 try{
  const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw Error('Could not load the Live Tracking workspace.');
  let html=await r.text();
  html=html.replace('<title>NWTB Delivery Operations</title>','<title>NWTB Delivery Operations — Live Tracking</title>');
  html=html.replace('<div class="brand"><div class="mark">NWTB</div><div><b>Delivery Operations</b><span>Northwest Trucks</span></div></div>','<div class="brand"><div class="mark">NWTB</div><div><b>Delivery Operations</b><span>Live Tracking Edition</span></div></div>');
  html=html.replaceAll('src="dispatch.html','src="dispatch-live.html');
  html=html.replaceAll('dispatch-live.html?v=20260923-0825','dispatch-live.html?v=20260925-0718');
  html=html.replace(/<iframe id="fChat" src="[^"]+"/,'<iframe id="fChat" src="dispatch-chat-console-live.html?v=20260924-1115"');
  html=html.replace('<iframe id="fTracker" src="tracker.html"','<iframe id="fTracker" data-live-src="tracker-live.html?v=20260925-0718" src="about:blank"');
  html=html.replace('<iframe id="fDriver" src="driver.html"','<iframe id="fDriver" data-live-src="driver-live.html?v=20260925-0718" src="about:blank"');
  html=html.replace('</body>','<script src="delivery-chat-notify-live.js?v=20260924-1115"><\/script><script src="delivery-live-map-activation.js?v=20260925-0718"><\/script><div class="liveBadge">LIVE TRACKING EDITION</div></body>');
  html=html.replace('</style>','.liveBadge{position:fixed;right:26px;top:24px;z-index:9999;border:1px solid #86efac;background:#ecfdf3;color:#067647;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900;letter-spacing:.35px;box-shadow:0 3px 10px rgba(16,24,40,.08);pointer-events:none}@media(max-width:720px){.liveBadge{right:10px;top:13px;font-size:9px;padding:6px 8px}}</style>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='<span class="err"><b>Live Tracking Edition failed to load.</b><br>'+String(e.message||e)+'</span>'}
})();
</script>
</body>
</html>
