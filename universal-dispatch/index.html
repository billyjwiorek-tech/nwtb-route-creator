<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Universal Dispatch Platform</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.boot{padding:24px}.err{color:#b42318}</style>
</head>
<body>
<div id="boot" class="boot">Loading Universal Delivery System…</div>
<script>
(async()=>{
 const base='https://raw.githubusercontent.com/billyjwiorek-tech/nwtb-route-creator/e20726528388327f105d2e1f7f17c64bce89f4e0/universal-dispatch/index.html';
 try{
  const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw Error('Could not load the Universal Delivery workspace.');
  let html=await r.text();
  html=html.replace('</body>','<script src="optimizer-v2.js?v=20260928-0825"><\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').innerHTML='<span class="err"><b>Universal Delivery System failed to load.</b><br>'+String(e.message||e)+'</span>'}
})();
</script>
</body>
</html>
