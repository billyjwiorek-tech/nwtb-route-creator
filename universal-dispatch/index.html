verflow:auto}.nav button{width:auto;white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.main{padding:14px}.map{height:360px}}

(function(){
'use strict';
const BASE='https://khvhcmncwzywqowfodnb.supabase.co/functions/v1',CORE=BASE+'/udp-core',ROUTE=BASE+'/udp-routing',KEY='sb_publishable_oTafXfr-ok1F-Kk_LEbsHg_yv8lovc-';
let token=localStorage.getItem('udp_session')||'',me=null,company=null,currentView='',liveMap=null,liveTimer=null,gpsWatch=null,currentRoute=null,currentGPS=null;
const app=document.getElementById('app'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,p,no=false){const h={'content-type':'application/json','apikey':KEY};if(!no&&token)h['x-udp-session']=token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(p)}),j=await r.json().catch(()=>({error:'Bad server response'}));if(!r.ok)throw Error(j.error||'Request failed');return j}

async function boot(){try{const s=await api(CORE,{action:'public_status'},true);if(!s.setup_completed)return setup();if(!token)return login();const m=await core('me');me=m.user;company=m.company;if(me.role==='DRIVER'||new URLSearchParams(location.search).get('view')==='driver')return driverHome();office()}catch(e){localStorage.removeItem('udp_session');token='';login(e.message)}}
function setup(){app.innerHTML=`<div class="login"><h1>Universal Dispatch Setup</h1><div class="sub">New company installation • separate backend • empty customer, vendor and driver lists</div><div class="g2"><div class="f"><label>ONE-TIME SETUP CODE</label><input id="sc"></div><div class="f"><label>COMPANY NAME</label><input id="cn"></div><div class="f"><label>DEPOT / WAREHOUSE NAME</label><input id="dn"></div><div class="f"><label>DEPOT PHYSICAL ADDRESS</label><input id="da"></div><div class="f"><label>ADMIN NAME</label><input id="an"></div><div class="f"><label>ADMIN EMAIL</label><input id="ae"></div><div class="f"><label>ADMIN LOGIN PIN</label><input id="ap" type="password"></div><div class="f"><label>MANAGEMENT CHANGE PIN</label><input id="mp" type="password"></div></div><button class="btn blue" id="go" style="width:100%;margin-top:14px">CREATE COMPANY SYSTEM</button><div id="sm" hidden></div></div>`;$('#go').onclick=async()=>{try{note('sm','Creating company system…');const j=await api(CORE,{action:'setup',setup_code:$('#sc').value,company_name:$('#cn').value,depot_name:$('#dn').value,depot_address:$('#da').value,admin_name:$('#an').value,admin_email:$('#ae').value,admin_login_pin:$('#ap').value,management_pin:$('#mp').value},true);token=j.token;localStorage.setItem('udp_session',token);boot()}catch(e){note('sm',e.message,'err')}}}
function login(err=''){const drv=new URLSearchParams(location.search).get('view')==='driver';app.innerHTML=`<div class="login"><h1>${drv?'Driver Login':'Universal Dispatch'}</h1><div class="sub">${drv?'Enter Driver Number and PIN':'Office / Administrator Sign In'}</div>${err?`<div class="note err">${esc(err)}</div>`:''}<div class="f"><label>${drv?'DRIVER NUMBER':'EMAIL'}</label><input id="li"></div><div class="f"><label>PIN</label><input id="lp" type="password"></div><button class="btn blue" id="lb" style="width:100%;margin-top:12px">SIGN IN</button><div id="lm" hidden></div></div>`;$('#lb').onclick=async()=>{try{const j=await api(CORE,{action:'login',kind:drv?'DRIVER':'OFFICE',identifier:$('#li').value,pin:$('#lp').value},true);token=j.token;localStorage.setItem('udp_session',token);boot()}catch(e){note('lm',e.message,'err')}}}
function office(){app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">${esc(company.name)}<small>Universal Dispatch Platform</small></div><div class="nav"><button data-v="dashboard">Dashboard</button><button data-v="dispatch">Dispatch</button><button data-v="routes">Routes</button><button data-v="live">Live Drivers</button><button data-v="drivers">Drivers</button><button data-v="entities">Customers / Vendors</button><button data-v="imports">Import Center</button><button data-v="chat">Chat</button><button data-v="admin">Admin</button><button id="out">Sign Out</button></div></aside><main class="main"><div id="v"></div></main></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));$('#out').onclick=()=>{localStorage.removeItem('udp_session');token='';login()};show('dashboard')}
async function show(v){currentView=v;if(liveTimer){clearInterval(liveTimer);liveTimer=null}document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#v').innerHTML='<div class="panel">Loading…</div>';try{if(v==='dashboard')await dashboard();if(v==='dispatch')await dispatch();if(v==='routes')await routesView();if(v==='live')await liveView();if(v==='drivers')await drivers();if(v==='entities')await entities();if(v==='imports')await imports();if(v==='chat')await officeChat();if(v==='admin')await admin()}catch(e){$('#v').innerHTML=`<div class="note err">${esc(e.message)}</div>`}}
async function dashboard(){const [o,r,d,e]=await Promise.all([route('orders_list'),route('routes_list'),core('drivers_list'),core('entities_list',{limit:500})]);$('#v').innerHTML=`<h1>Dashboard</h1><div class="sub">${esc(company.depot_name||'Company Depot')}</div><div class="cards"><div class="card"><b>${o.orders.filter(x=>x.status==='UNASSIGNED').length}</b><span>AVAILABLE STOPS</span></div><div class="card"><b>${r.routes.filter(x=>['ACTIVE','PAUSED'].includes(x.status)).length}</b><span>ACTIVE ROUTES</span></div><div class="card"><b>${d.drivers.filter(x=>x.active&&!x.pending_activation).length}</b><span>ACTIVE DRIVERS</span></div><div class="card"><b>${e.entities.length}</b><span>CUSTOMERS / VENDORS</span></div></div><div class="panel"><h2>Operational Workspace</h2><div class="sub">Build driver and customer masters, create routes, track active drivers, manage imports and communicate from one system.</div></div>`}
async function drivers(){const j=await core('drivers_list');const rows=j.drivers.map(x=>`<tr><td>${esc(x.driver_number)}</td><td><b>${esc(x.full_name)}</b></td><td>${esc(x.email||'')}</td><td><span class="badge ${x.pending_activation?'pending':'active'}">${x.pending_activation?'PENDING':'ACTIVE'}</span></td><td>${x.pending_activation?`<button class="btn green act" data-id="${x.id}">ACTIVATE</button>`:'—'}</td></tr>`).join('');$('#v').innerHTML=`<h1>Drivers</h1><div class="toolbar"><button class="btn blue" id="impDrivers">IMPORT DRIVERS</button></div><div class="panel"><h2>Add Driver</h2><div class="g3"><div class="f"><label>FULL NAME</label><input id="dnm"></div><div class="f"><label>EMAIL</label><input id="dem"></div><div class="f"><label>PHONE</label><input id="dph"></div></div><button class="btn green" id="dadd" style="margin-top:12px">ADD DRIVER</button><div id="dm" hidden></div></div><div class="panel"><h2>Driver Roster</h2><div class="table"><table><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan="5">No drivers yet.</td></tr>'}</table></div></div>`;$('#impDrivers').onclick=()=>show('imports');$('#dadd').onclick=async()=>{try{const x=await core('driver_create',{full_name:$('#dnm').value,email:$('#dem').value,phone:$('#dph').value});note('dm',`Driver ${x.driver.driver_number} created. Temporary PIN: ${x.temporary_pin}`,'ok');setTimeout(()=>show('drivers'),1200)}catch(e){note('dm',e.message,'err')}};document.querySelectorAll('.act').forEach(b=>b.onclick=async()=>{await core('driver_set_active',{driver_id:b.dataset.id,active:true});show('drivers')})}
async function entities(){const j=await core('entities_list',{limit:500});const rows=j.entities.map(x=>`<tr><td>${esc(x.entity_type)}</td><td><b>${esc(x.company_name)}</b><br><span class="small">${esc(x.contact_name||'')}</span></td><td>${esc(x.address||'')}</td><td>${esc(x.email||'')}</td><td><span class="badge">${esc(x.location_status)}</span></td></tr>`).join('');$('#v').innerHTML=`<h1>Customers / Vendors</h1><div class="toolbar"><button class="btn blue" id="impEnt">IMPORT RECORDS</button></div><div class="panel"><h2>Add Record</h2><div class="g3"><div class="f"><label>COMPANY</label><input id="en"></div><div class="f"><label>TYPE</label><select id="et"><option>CUSTOMER</option><option>VENDOR</option><option>BOTH</option><option>PROSPECT</option></select></div><div class="f"><label>CONTACT</label><input id="ec"></div></div><div class="g3"><div class="f"><label>PHYSICAL ADDRESS</label><input id="ea"></div><div class="f"><label>EMAIL</label><input id="ee"></div><div class="f"><label>PHONE</label><input id="ep"></div></div><button class="btn green" id="es" style="margin-top:12px">SAVE + GEOCODE</button><div id="em" hidden></div></div><div class="panel"><h2>Master Records</h2><div class="table"><table><tr><th>Type</th><th>Company / Contact</th><th>Address</th><th>Email</th><th>Location</th></tr>${rows||'<tr><td colspan="5">No customer/vendor records yet.</td></tr>'}</table></div></div>`;$('#impEnt').onclick=()=>show('imports');$('#es').onclick=async()=>{try{note('em','Saving and geocoding…');await core('entity_save',{company_name:$('#en').value,entity_type:$('#et').value,contact_name:$('#ec').value,address:$('#ea').value,email:$('#ee').value,phone:$('#ep').value});note('em','Record saved.','ok');setTimeout(()=>show('entities'),700)}catch(e){note('em',e.message,'err')}}}
async function dispatch(){const [o,d]=await Promise.all([route('orders_list',{statuses:['UNASSIGNED','ROUTED','OUT_FOR_DELIVERY']}),core('drivers_list')]);const ds=d.drivers.filter(x=>x.active&&!x.pending_activation);const opts=ds.map(x=>`<option value="${x.id}">${esc(x.full_name)} (${esc(x.driver_number)})</option>`).join('');const rows=o.orders.map(x=>`<tr><td>${x.status==='UNASSIGNED'?`<input class="pick" type="checkbox" value="${x.id}">`:'—'}</td><td>${esc(x.priority)}</td><td><b>${esc(x.customer_name)}</b></td><td>${esc(x.address)}</td><td>${esc(x.status)}</td></tr>`).join('');$('#v').innerHTML=`<h1>Dispatch</h1><div class="panel"><h2>Add Stop</h2><div class="g3"><div class="f"><label>STOP / COMPANY</label><input id="sn"></div><div class="f"><label>ADDRESS</label><input id="sa"></div><div class="f"><label>PRIORITY</label><select id="sp"><option>NORMAL</option><option>PRIORITY</option><option>HOT_SHOT</option><option>MUST_FIRST</option></select></div></div><button class="btn green" id="sadd" style="margin-top:12px">ADD STOP + GEOCODE</button><div id="sm2" hidden></div></div><div class="panel"><h2>Route Builder</h2><div class="g3"><div class="f"><label>DRIVER</label><select id="rd"><option value="">Select driver</option>${opts}</select></div><div class="f"><label>START</label><select id="rs"><option value="DEPOT">Company Depot</option><option value="DRIVER_CURRENT">Driver Current GPS</option></select></div><div class="f"><label>END</label><select id="re"><option value="RETURN_DEPOT">Return to Depot</option><option value="LAST_STOP">Last Stop</option></select></div></div><label style="display:block;margin-top:12px"><input id="po" type="checkbox"> Keep selected stop order exactly</label><button class="btn blue" id="rc" style="margin-top:12px">CREATE ROUTE</button></div><div class="panel"><h2>Dispatch Queue</h2><div class="table"><table><tr><th></th><th>Priority</th><th>Stop</th><th>Address</th><th>Status</th></tr>${rows||'<tr><td colspan="5">No open stops.</td></tr>'}</table></div></div>`;$('#sadd').onclick=async()=>{try{note('sm2','Locating address…');await route('order_create',{customer_name:$('#sn').value,address:$('#sa').value,priority:$('#sp').value});note('sm2','Stop added.','ok');setTimeout(()=>show('dispatch'),700)}catch(e){note('sm2',e.message,'err')}};$('#rc').onclick=async()=>{try{const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)throw Error('Select at least one AVAILABLE stop.');if(!$('#rd').value)throw Error('Select a driver.');const j=await route('route_create',{driver_id:$('#rd').value,order_ids:ids,start_mode:$('#rs').value,end_mode:$('#re').value,preserve_order:$('#po').checked});alert(`Route created with ${j.stops.length} stop(s).`);show('dispatch')}catch(e){alert(e.message)}}}
async function routesView(){const j=await route('routes_list');const rows=j.routes.map(r=>`<tr><td>${esc(r.route_date)}</td><td><b>${esc((r.app_users||{}).full_name||'')}</b></td><td>${esc(r.status)}</td><td>${esc(r.route_mode||'')}</td><td>${r.estimated_miles?Number(r.estimated_miles).toFixed(1)+' mi':'—'}</td></tr>`).join('');$('#v').innerHTML=`<h1>Routes</h1><div class="panel"><div class="table"><table><tr><th>Date</th><th>Driver</th><th>Status</th><th>Mode</th><th>Miles</th></tr>${rows||'<tr><td colspan="5">No routes yet.</td></tr>'}</table></div></div>`}
async function liveView(){$('#v').innerHTML='<h1>Live Drivers</h1><div class="panel"><div id="liveList"></div><div id="liveMap" class="map"></div></div>';liveMap=L.map('liveMap').setView([39.5,-98.35],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(liveMap);const refresh=async()=>{try{const j=await route('locations_latest');$('#liveList').innerHTML=(j.drivers||[]).map(x=>`<div class="routeStop"><b>${esc((x.driver||{}).full_name||'Driver')}</b> • ${esc(x.route_status)} • ${x.gps_age_seconds==null?'NO GPS':x.gps_age_seconds+' sec ago'}</div>`).join('')||'<div class="sub">No active drivers.</div>';liveMap.eachLayer(l=>{if(l instanceof L.Marker)liveMap.removeLayer(l)});const pts=[];(j.drivers||[]).forEach(x=>{const p=x.location;if(!p)return;const icon=L.divIcon({className:'',html:'<div class="vanIcon"></div>',iconSize:[42,30],iconAnchor:[20,20]});L.marker([p.lat,p.lon],{icon}).addTo(liveMap).bindPopup(`<b>${esc((x.driver||{}).full_name||'Driver')}</b><br>${esc(x.route_status)}`);pts.push([p.lat,p.lon])});if(pts.length)liveMap.fitBounds(pts,{padding:[40,40],maxZoom:13})}catch(e){$('#liveList').innerHTML=`<div class="note err">${esc(e.message)}</div>`}};await refresh();liveTimer=setInterval(refresh,5000)}
function normalizeRow(r){const low={};Object.keys(r||{}).forEach(k=>low[String(k).toLowerCase().trim().replace(/[^a-z0-9]+/g,'_')]=r[k]);return low}
function driverRow(r){r=normalizeRow(r);return {full_name:r.full_name||r.name||r.driver_name||r.employee_name||'',email:r.email||r.email_address||'',phone:r.phone||r.phone_number||r.mobile||'',driver_number:r.driver_number||r.employee_number||r.employee_id||''}}
function entityRow(r,def='CUSTOMER'){r=normalizeRow(r);return {company_name:r.company_name||r.company||r.business_name||r.customer_name||r.vendor_name||r.name||'',contact_name:r.contact_name||r.contact||r.person||'',address:r.address||r.physical_address||r.street_address||[r.address1,r.city,r.state,r.zip].filter(Boolean).join(', '),email:r.email||r.email_address||'',phone:r.phone||r.phone_number||'',entity_type:(r.entity_type||r.type||def).toUpperCase()}}
async function parseFile(f){const ext=f.name.split('.').pop().toLowerCase();if(ext==='csv'){return new Promise((res,rej)=>Papa.parse(f,{header:true,skipEmptyLines:true,complete:x=>res(x.data),error:rej}))}if(['xlsx','xls'].includes(ext)){const ab=await f.arrayBuffer(),wb=XLSX.read(ab),ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{defval:''})}if(['txt','eml'].includes(ext)){const t=await f.text();return parseText(t)}if(ext==='pdf'){const t=await extractPdf(f);return parseText(t)}if(['png','jpg','jpeg','webp'].includes(ext)){if(!window.Tesseract){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js')}const r=await Tesseract.recognize(f,'eng');return parseText(r.data.text||'')}throw Error('Unsupported file type: '+f.name)}
function parseText(t){const lines=String(t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[];for(let i=0;i<lines.length;i++){const line=lines[i],email=(line.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'',phone=(line.match(/(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}/)||[])[0]||'';if(email||phone||/\b(?:inc|llc|corp|company|co\.|services|supply|trucking|repair|transport|logistics|fleet|shop)\b/i.test(line)){out.push({name:line.replace(email,'').replace(phone,'').trim(),email,phone,address:lines[i+1]||''})}}return out.length?out:lines.slice(0,200).map(x=>({name:x}))}
async function extractPdf(f){if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}return text}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function imports(){$('#v').innerHTML=`<h1>Import Center</h1><div class="panel"><div class="importDrop"><h2>Build Your Company Data</h2><div class="sub">Upload up to 50 files per batch: Excel, CSV, PDF, text/email exports, screenshots and images.</div><div class="f"><label>IMPORT AS</label><select id="ik"><option value="AUTO">AUTO DETECT</option><option value="DRIVERS">DRIVERS</option><option value="CUSTOMER">CUSTOMERS</option><option value="VENDOR">VENDORS</option></select></div><input id="files" type="file" multiple accept=".csv,.xlsx,.xls,.pdf,.txt,.eml,.png,.jpg,.jpeg,.webp" style="margin-top:14px"><button class="btn blue" id="process" style="margin-top:14px">READ FILES</button><div id="im" hidden></div></div><div id="preview"></div></div>`;$('#process').onclick=async()=>{try{const fs=[...$('#files').files];if(!fs.length)throw Error('Choose at least one file.');if(fs.length>50)throw Error('Select no more than 50 files in one batch.');note('im',`Reading ${fs.length} file(s)…`);let rows=[];for(let i=0;i<fs.length;i++){note('im',`Reading ${i+1} of ${fs.length}: ${fs[i].name}`);const x=await parseFile(fs[i]);rows.push(...x.map(r=>({...r,__source:fs[i].name})))}renderImportPreview(rows,$('#ik').value)}catch(e){note('im',e.message,'err')}}}
function renderImportPreview(rows,kind){let mode=kind;if(mode==='AUTO'){const keys=Object.keys(normalizeRow(rows[0]||{}));mode=keys.some(k=>/driver|employee/.test(k))?'DRIVERS':'CUSTOMER'}const mapped=mode==='DRIVERS'?rows.map(driverRow):rows.map(r=>entityRow(r,mode==='VENDOR'?'VENDOR':'CUSTOMER'));window.__imp=mapped;$('#preview').innerHTML=`<div class="panel"><h2>Review Import</h2><div class="sub">${mapped.length} candidate row(s) • ${esc(mode)}</div><div class="table"><table><tr>${mode==='DRIVERS'?'<th>Name</th><th>Email</th><th>Phone</th><th>Number</th>':'<th>Company</th><th>Contact</th><th>Address</th><th>Type</th>'}</tr>${mapped.slice(0,250).map(r=>mode==='DRIVERS'?`<tr><td>${esc(r.full_name)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.driver_number)}</td></tr>`:`<tr><td>${esc(r.company_name)}</td><td>${esc(r.contact_name)}</td><td>${esc(r.address)}</td><td>${esc(r.entity_type)}</td></tr>`).join('')}</table></div><button class="btn green" id="commit" style="margin-top:12px">COMMIT IMPORT</button><div id="cm" hidden></div></div>`;$('#commit').onclick=async()=>{try{note('cm','Importing…');if(mode==='DRIVERS'){const j=await core('drivers_import_commit',{rows:mapped});note('cm',`Created ${j.created_count} pending driver(s); ${j.review_count} need review.`,'ok')}else{const p=await core('entities_import_preview',{rows:mapped});const approved=p.preview.filter(x=>x.status!=='REVIEW');const j=await core('entities_import_commit',{rows:approved,auto_geocode:true});note('cm',`Created ${j.created}; updated ${j.updated}; review ${j.review}.`,'ok')}}catch(e){note('cm',e.message,'err')}}}
async function officeChat(){const d=await core('drivers_list');const drivers=d.drivers.filter(x=>x.active&&!x.pending_activation);$('#v').innerHTML=`<h1>Chat</h1><div class="panel"><h2>Dispatch ↔ Driver</h2><div class="sub">Operational chats are visible to Dispatch. Private Driver-to-Driver chats are intentionally not listed here.</div><div class="tabs">${drivers.map(x=>`<button class="cdrv" data-id="${x.id}">${esc(x.full_name)}</button>`).join('')}</div><div id="chatArea"></div></div>`;document.querySelectorAll('.cdrv').forEach(b=>b.onclick=()=>openOfficeThread(b.dataset.id))}
async function openOfficeThread(driverId){const t=await core('chat_dispatch_thread',{driver_id:driverId});const draw=async()=>{const j=await core('chat_messages',{thread_id:t.thread_id});$('#chatArea').innerHTML=`<div class="chatbox">${j.messages.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(m.body_plaintext||'')}</div>`).join('')}</div><div class="toolbar"><input id="chatText" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn blue" id="sendChat">SEND</button></div>`;$('#sendChat').onclick=async()=>{const body=$('#chatText').value.trim();if(!body)return;await core('chat_send',{thread_id:t.thread_id,body});draw()};const box=document.querySelector('.chatbox');box.scrollTop=box.scrollHeight};await draw()}
async function admin(){const m=await core('me');company=m.company;$('#v').innerHTML=`<h1>Admin</h1><div class="panel"><div class="g2"><div class="f"><label>COMPANY NAME</label><input id="ac" value="${esc(company.name)}"></div><div class="f"><label>DEPOT NAME</label><input id="ad" value="${esc(company.depot_name||'')}"></div></div><div class="f"><label>DEPOT ADDRESS</label><input id="aa" value="${esc(company.depot_address||'')}"></div><div class="g2"><div class="f"><label>PRIVATE DRIVER-TO-DRIVER CHAT</label><select id="ach"><option value="1">ENABLED</option><option value="0">DISABLED</option></select></div><div class="f"><label>MESSAGE RETENTION DAYS</label><input id="ar" type="number" value="${company.driver_chat_retention_days||90}"></div></div><div class="f"><label>NEW MANAGEMENT PIN (OPTIONAL)</label><input id="amp" type="password"></div><button id="as" class="btn blue" style="margin-top:12px">SAVE SETTINGS</button><div id="am" hidden></div></div>`;$('#ach').value=company.driver_chat_enabled?'1':'0';$('#as').onclick=async()=>{try{await core('settings_update',{company_name:$('#ac').value,depot_name:$('#ad').value,depot_address:$('#aa').value,driver_chat_enabled:$('#ach').value==='1',driver_chat_retention_days:Number($('#ar').value),management_pin:$('#amp').value||undefined});note('am','Settings saved.','ok');const mm=await core('me');company=mm.company}catch(e){note('am',e.message,'err')}}}
async function driverHome(){app.innerHTML=`<div class="driverShell"><div class="panel"><h1>${esc(company.name)}</h1><div class="sub">Driver ${esc(me.driver_number)} • ${esc(me.full_name)}</div><div class="toolbar"><button class="btn blue" id="drvRoute">MY ROUTE</button><button class="btn ghost" id="drvDispatch">DISPATCH CHAT</button><button class="btn ghost" id="drvDrivers">DRIVER CHAT</button><button class="btn ghost" id="drvOut">SIGN OUT</button></div></div><div id="dv"></div></div>`;$('#drvOut').onclick=()=>{if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);localStorage.removeItem('udp_session');token='';login()};$('#drvRoute').onclick=driverRoute;$('#drvDispatch').onclick=driverDispatchChat;$('#drvDrivers').onclick=driverPrivateList;startGPS();driverRoute()}
function startGPS(){if(!navigator.geolocation)return;gpsWatch=navigator.geolocation.watchPosition(async p=>{currentGPS={lat:p.coords.latitude,lon:p.coords.longitude,accuracy_m:p.coords.accuracy,speed_mps:p.coords.speed,heading:p.coords.heading};try{await route('location_update',{...currentGPS,route_id:currentRoute?.id||null,source:'WEB_DRIVER'})}catch{}},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
async function driverRoute(){const j=await route('routes_list',{statuses:['PLANNED','ACTIVE','PAUSED']});const r=j.routes[0];if(!r){$('#dv').innerHTML='<div class="panel"><h2>No Active Route</h2><div class="sub">There is no planned or active route assigned to you.</div></div>';return}currentRoute=r;const d=await route('route_get',{route_id:r.id});const next=d.stops.find(x=>x.status==='PENDING'||x.status==='ARRIVED');$('#dv').innerHTML=`<div class="panel"><h2>${esc(r.status)} ROUTE</h2><div class="sub">${d.stops.length} stop(s) • ${r.estimated_miles?Number(r.estimated_miles).toFixed(1)+' mi':''}</div><div class="toolbar">${r.status==='PLANNED'?'<button class="btn green" id="startR">START ROUTE</button>':''}${r.status==='ACTIVE'?'<button class="btn ghost" id="pauseR">PAUSE</button>':''}${r.status==='PAUSED'?'<button class="btn green" id="resumeR">RESUME</button>':''}${next?'<button class="btn blue" id="navR">NAVIGATE NEXT</button>':''}</div></div><div class="panel"><h2>Stops</h2>${d.stops.map(s=>{const o=s.delivery_orders||{};return `<div class="routeStop ${next&&next.id===s.id?'current':''}"><b>STOP ${s.stop_sequence}: ${esc(o.customer_name||'')}</b><div class="sub">${esc(o.address||'')} • ${esc(s.status)}</div>${next&&next.id===s.id?`<div class="toolbar"><button class="btn ghost arrive" data-id="${s.id}">ARRIVED</button><button class="btn green done" data-id="${s.id}">DELIVERED</button><button class="btn red fail" data-id="${s.id}">NOT DELIVERED</button></div>`:''}</div>`}).join('')}</div><div id="navPanel"></div>`;if($('#startR'))$('#startR').onclick=async()=>{await route('route_start',{route_id:r.id});driverRoute()};if($('#pauseR'))$('#pauseR').onclick=async()=>{const reason=prompt('Pause reason:')||'Driver pause';await route('route_pause',{route_id:r.id,reason});driverRoute()};if($('#resumeR'))$('#resumeR').onclick=async()=>{await route('route_resume',{route_id:r.id});driverRoute()};if($('#navR'))$('#navR').onclick=()=>navigateTo(next);document.querySelectorAll('.arrive').forEach(b=>b.onclick=async()=>{await route('stop_arrive',{route_stop_id:b.dataset.id});driverRoute()});document.querySelectorAll('.done').forEach(b=>b.onclick=async()=>{const receiver=prompt('Receiver name (optional):')||'',noteText=prompt('Delivery note (optional):')||'';await route('stop_complete',{route_stop_id:b.dataset.id,note:noteText,pod:{receiver_name:receiver,note:noteText,lat:currentGPS?.lat,lon:currentGPS?.lon}});driverRoute()});document.querySelectorAll('.fail').forEach(b=>b.onclick=async()=>{const reason=prompt('Why was this not delivered?')||'Not delivered';await route('stop_not_delivered',{route_stop_id:b.dataset.id,note:reason});driverRoute()})}
async function navigateTo(s){if(!currentGPS)return alert('Waiting for GPS. Allow precise location and try again.');const o=s.delivery_orders||{};const j=await route('navigation',{points:[currentGPS,{lat:o.lat,lon:o.lon}]});$('#navPanel').innerHTML=`<div class="panel"><div class="turn">${esc(j.steps[0]?.maneuver?.instruction||j.steps[0]?.name||'Follow route')}</div><div class="sub">${(j.distance_m/1609.344).toFixed(1)} mi • ${Math.round(j.duration_s/60)} min</div><div id="navMap" class="map"></div></div>`;const m=L.map('navMap').setView([currentGPS.lat,currentGPS.lon],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);const coords=j.geometry.coordinates.map(x=>[x[1],x[0]]);L.polyline(coords,{weight:6}).addTo(m);L.marker([o.lat,o.lon]).addTo(m);m.fitBounds(coords,{padding:[30,30]});const txt=j.steps[0]?.maneuver?.instruction||j.steps[0]?.name;if(txt&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(txt))}}
async function driverDispatchChat(){const t=await core('chat_dispatch_thread');await renderDriverPlainChat(t.thread_id,'Dispatch')}
async function renderDriverPlainChat(tid,title){const draw=async()=>{const j=await core('chat_messages',{thread_id:tid});$('#dv').innerHTML=`<div class="panel"><h2>${esc(title)}</h2><div class="chatbox">${j.messages.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(m.body_plaintext||'')}</div>`).join('')}</div><div class="toolbar"><input id="dt" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn blue" id="ds">SEND</button></div></div>`;$('#ds').onclick=async()=>{const body=$('#dt').value.trim();if(!body)return;await core('chat_send',{thread_id:tid,body});draw()}};await draw()}
async function ensureDriverKey(){let raw=localStorage.getItem('udp_e2ee_key');if(raw){const x=JSON.parse(raw);return {privateKey:await crypto.subtle.importKey('jwk',x.privateKey,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey']),publicJwk:x.publicKey}}const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']),priv=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=await crypto.subtle.exportKey('jwk',kp.publicKey);localStorage.setItem('udp_e2ee_key',JSON.stringify({privateKey:priv,publicKey:pub}));await core('e2ee_public_key_set',{public_key:pub});return {privateKey:kp.privateKey,publicJwk:pub}}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sharedKey(priv,pubJwk){const pub=await crypto.subtle.importKey('jwk',pubJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function driverPrivateList(){if(!company.driver_chat_enabled){$('#dv').innerHTML='<div class="note err">Private Driver-to-Driver messaging is disabled by Dispatch/Admin.</div>';return}await ensureDriverKey();const d=await core('drivers_list');const others=d.drivers.filter(x=>x.id!==me.id&&x.active&&!x.pending_activation&&x.messaging_enabled);$('#dv').innerHTML=`<div class="panel"><h2>Private Driver Chat</h2><div class="sub">End-to-end encrypted direct messages. Dispatch cannot retrieve these conversations.</div><div class="tabs">${others.map(x=>`<button class="pdrv" data-id="${x.id}">${esc(x.full_name)} (${esc(x.driver_number)})</button>`).join('')}</div></div>`;document.querySelectorAll('.pdrv').forEach(b=>b.onclick=()=>openPrivate(b.dataset.id))}
async function openPrivate(otherId){const key=await ensureDriverKey(),t=await core('chat_driver_direct_open',{driver_id:otherId}),other=t.other_driver;if(!other.e2ee_public_key){$('#dv').innerHTML='<div class="note err">That driver has not initialized private chat on their device yet.</div>';return}const k=await sharedKey(key.privateKey,other.e2ee_public_key);const draw=async()=>{const j=await core('chat_messages',{thread_id:t.thread_id}),msgs=[];for(const m of j.messages){let text='[Encrypted message unavailable]';try{const iv=unb64(m.cipher_iv),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,unb64(m.cipher_text));text=new TextDecoder().decode(plain)}catch{}msgs.push(`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(text)}</div>`)}$('#dv').innerHTML=`<div class="panel"><h2>${esc(other.full_name)}</h2><div class="sub">PRIVATE • END-TO-END ENCRYPTED</div><div class="chatbox">${msgs.join('')}</div><div class="toolbar"><input id="pt" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn blue" id="ps">SEND</button></div></div>`;$('#ps').onclick=async()=>{const text=$('#pt').value.trim();if(!text)return;const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));await core('chat_send',{thread_id:t.thread_id,cipher_text:b64(cipher),cipher_iv:b64(iv),crypto_meta:{alg:'ECDH-P256/AES-GCM',sender_public_key:key.publicJwk,recipient_public_key:other.e2ee_public_key}});draw()}};await draw()}
boot();
})();
