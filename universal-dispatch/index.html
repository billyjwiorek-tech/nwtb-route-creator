le{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid #eef1f4;text-align:left;vertical-align:top}th{font-size:9px;color:#667085;text-transform:uppercase;white-space:nowrap}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef1f4;font-size:9px;font-weight:900}.pending{background:#fff7ed;color:#c2410c}.active{background:#ecfdf3;color:#067647}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.map{height:480px;border-radius:12px;border:1px solid #e4e7ec;margin-top:12px}.vanIcon{width:34px;height:20px;background:white;border:2px solid #101828;border-radius:5px;position:relative;box-shadow:0 2px 6px #0003}.vanIcon:before{content:'';position:absolute;right:-7px;top:5px;width:10px;height:13px;background:#fff;border:2px solid #101828;border-left:0;border-radius:0 4px 4px 0}.vanIcon:after{content:'●  ●';position:absolute;left:4px;bottom:-10px;font-size:9px;color:#101828;letter-spacing:8px;white-space:nowrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 10px;font-weight:800;cursor:pointer}.tabs button.on{background:#101828;color:#fff}.chatbox{height:360px;overflow:auto;border:1px solid #e4e7ec;border-radius:12px;padding:10px;background:#f9fafb}.msg{max-width:80%;padding:9px 11px;border-radius:12px;margin:6px 0;background:#fff;border:1px solid #e4e7ec}.msg.mine{margin-left:auto;background:#eef4ff}.importDrop{border:2px dashed #b2ccff;border-radius:14px;padding:24px;text-align:center;background:#f8faff}.small{font-size:10px;color:#667085}.driverShell{max-width:900px;margin:0 auto;padding:14px}.turn{font-size:26px;font-weight:900}.routeStop{border:1px solid #e4e7ec;border-radius:12px;padding:12px;margin-top:8px}.routeStop.current{border:2px solid #2563eb;background:#eef4ff}@media(max-width:900px){.shell{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.main{padding:14px}.map{height:360px}}
.driverPickGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.driverPick{border:1px solid #d0d5dd;background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer}.driverPick.on{border-color:#2563eb;background:#eef4ff}.driverQueue{display:grid;gap:8px;margin-top:10px}.driverQueueRow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;align-items:center;padding:10px;border:1px solid #d0d5dd;border-radius:10px;background:#f9fafb}.driverQueueRow select{width:100%;padding:9px;border:1px solid #cfd6df;border-radius:8px;background:#fff;font-weight:800}.driverQueueRow select.missing{border-color:#f04438;background:#fff5f5;color:#b42318}.routeSummaryGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.routeSummary{border:1px solid #d0d5dd;border-radius:12px;padding:12px;background:#fff}.routeSummary b{display:block}.routeSummary small{display:block;color:#667085;margin-top:4px}.priorityRow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.priorityRow select{padding:7px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.routeAlert{position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#7c3aed;color:#fff;padding:14px 16px;border-radius:12px;font-weight:900;box-shadow:0 14px 40px #0004;text-align:center}.routeAlert small{display:block;margin-top:5px;font-size:11px;font-weight:700}@media(max-width:900px){.driverPickGrid,.routeSummaryGrid{grid-template-columns:1fr}.driverQueueRow{grid-template-columns:1fr}}</style>

<script>
(function(){
'use strict';
const BASE='https://khvhcmncwzywqowfodnb.supabase.co/functions/v1',CORE=BASE+'/udp-core',ROUTE=BASE+'/udp-routing',OPT=BASE+'/udp-route-optimizer-v2',KEY='sb_publishable_oTafXfr-ok1F-Kk_LEbsHg_yv8lovc-';
const driverView=UDPSessions.isDriverView(),gpsEdition=new URLSearchParams(location.search).get('edition')!=='standard';
let token=UDPSessions.get(),me=null,company=null,currentView='',liveMap=null,liveTimer=null,routeAlertTimer=null,gpsWatch=null,currentRoute=null,currentGPS=null,trackingRoute=null,viewEpoch=0,routeListVersion='',managementPin='';
const app=document.getElementById('app'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(url,p,no=false,options={}){const h={'content-type':'application/json','apikey':KEY};if(!no&&token)h['x-udp-session']=token;const load=async()=>{const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(p),signal:options.signal}),j=await r.json().catch(()=>({error:'Bad server response'}));if(!r.ok){const e=Error(j.error||'Request failed');e.status=r.status;e.code=j.code;throw e}return j};return UDPSessions.readThrough(token,url,p,load,!no&&driverView&&me?.role==='DRIVER'&&['route_get','routes_list'].includes(p.action))}

const core=(a,p={})=>api(CORE,{action:a,...p}),route=(a,p={})=>api(ROUTE,{action:a,...p}),opt=(a,p={})=>api(OPT,{action:a,...p});
function note(id,t,k=''){const x=document.getElementById(id);if(x){x.className='note '+k;x.textContent=t;x.hidden=false}}
async function boot(){try{const st=await api(CORE,{action:'public_status'},true);if(!st.setup_completed){if(driverView){app.innerHTML='<div class="login"><h1>Driver sign-in</h1><div class="sub">Office must complete company setup before drivers can sign in.</div><a class="btn blue" href="./">OPEN OFFICE SETUP</a></div>';return}return setup()}let legacy=false;if(!token){token=localStorage.getItem('udp_session')||'';legacy=!!token}if(!token)return login();const m=await core('me');if(driverView?(m.user.role!=='DRIVER'):!['ADMIN','DISPATCH'].includes(m.user.role)){token='';return login('Use the sign-in for this workspace. Your other workspace session is unchanged.')}me=m.user;company=m.company;if(legacy){UDPSessions.set(token);localStorage.removeItem('udp_session')}return driverView?driverHome():office()}catch(e){UDPSessions.clear();token='';login(e.message)}}
async function signOut(){stopGPS();UDPRouteMap.destroy();if(routeAlertTimer){clearInterval(routeAlertTimer);routeAlertTimer=null}try{await core('logout')}catch{}UDPSessions.clear();token='';me=null;currentRoute=null;login()}

function setup(){app.innerHTML=`<div class="login"><h1>Universal Dispatch Setup</h1><div class="sub">New company installation • separate backend • empty customer, vendor and driver lists</div><div class="g2"><div class="f"><label>ONE-TIME SETUP CODE</label><input id="sc"></div><div class="f"><label>COMPANY NAME</label><input id="cn"></div><div class="f"><label>DEPOT / WAREHOUSE NAME</label><input id="dn"></div><div class="f"><label>DEPOT PHYSICAL ADDRESS</label><input id="da"></div><div class="f"><label>ADMIN NAME</label><input id="an"></div><div class="f"><label>ADMIN EMAIL</label><input id="ae"></div><div class="f"><label>ADMIN LOGIN PIN</label><input id="ap" type="password"></div><div class="f"><label>MANAGEMENT CHANGE PIN</label><input id="mp" type="password"></div></div><button class="btn blue" id="go" style="width:100%;margin-top:14px">CREATE COMPANY SYSTEM</button><div id="sm" hidden></div></div>`;$('#go').onclick=async()=>{try{note('sm','Creating company system…');const j=await api(CORE,{action:'setup',setup_code:$('#sc').value,company_name:$('#cn').value,depot_name:$('#dn').value,depot_address:$('#da').value,admin_name:$('#an').value,admin_email:$('#ae').value,admin_login_pin:$('#ap').value,management_pin:$('#mp').value},true);token=j.token;UDPSessions.set(token);boot()}catch(e){note('sm',e.message,'err')}}}
function login(err=''){const drv=new URLSearchParams(location.search).get('view')==='driver';app.innerHTML=`<div class="login"><h1>${drv?'Driver Login':'Universal Dispatch'}</h1><div class="sub">${drv?'Enter Driver Number and PIN':'Office / Administrator Sign In'}</div>${err?`<div class="note err">${esc(err)}</div>`:''}<div class="f"><label>${drv?'DRIVER NUMBER':'EMAIL'}</label><input id="li"></div><div class="f"><label>PIN</label><input id="lp" type="password"></div><button class="btn blue" id="lb" style="width:100%;margin-top:12px">SIGN IN</button><div id="lm" hidden></div></div>`;$('#lb').onclick=async()=>{try{const j=await api(CORE,{action:'login',kind:drv?'DRIVER':'OFFICE',identifier:$('#li').value,pin:$('#lp').value},true);token=j.token;UDPSessions.set(token);boot()}catch(e){note('lm',e.message,'err')}}}
function office(){app.innerHTML=`<div class="shell"><aside class="side"><div class="brand">${esc(company.name)}<small>Universal Dispatch Platform</small></div><div class="nav"><button data-v="dashboard">Dashboard</button><button data-v="dispatch">Dispatch</button><button data-v="routes">Routes</button><button data-v="live">Live Drivers</button><button data-v="drivers">Drivers</button><button data-v="entities">Customers / Vendors</button><button data-v="imports">Import Center</button><button data-v="chat">Chat</button><button data-v="admin">Admin</button><button id="out">Sign Out</button></div></aside><main class="main"><div id="v"></div></main></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));$('#out').onclick=signOut;show('dashboard')}
async function show(v){viewEpoch++;UDPRouteMap.destroy();currentView=v;if(liveTimer){clearInterval(liveTimer);liveTimer=null}document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#v').innerHTML='<div class="panel">Loading…</div>';try{if(v==='dashboard')await dashboard();if(v==='dispatch')await dispatch();if(v==='routes')await routesView();if(v==='live')await liveView();if(v==='drivers')await drivers();if(v==='entities')await entities();if(v==='imports')await imports();if(v==='chat')await officeChat();if(v==='admin')await admin()}catch(e){$('#v').innerHTML=`<div class="note err">${esc(e.message)}</div>`}}
async function dashboard(){const [o,r,d,e]=await Promise.all([route('orders_list'),route('routes_list'),core('drivers_list'),core('entities_list',{limit:500})]);$('#v').innerHTML=`<h1>Dashboard</h1><div class="sub">${esc(company.depot_name||'Company Depot')}</div><div class="cards"><div class="card"><b>${o.orders.filter(x=>x.status==='UNASSIGNED').length}</b><span>AVAILABLE STOPS</span></div><div class="card"><b>${r.routes.filter(x=>['ACTIVE','PAUSED'].includes(x.status)).length}</b><span>ACTIVE ROUTES</span></div><div class="card"><b>${d.drivers.filter(x=>x.active&&!x.pending_activation).length}</b><span>ACTIVE DRIVERS</span></div><div class="card"><b>${e.entities.length}</b><span>CUSTOMERS / VENDORS</span></div></div><div class="panel"><h2>Operational Workspace</h2><div class="sub">Build driver and customer masters, create routes, track active drivers, manage imports and communicate from one system.</div></div>`}
async function drivers(){const j=await core('drivers_list');const rows=j.drivers.map(x=>`<tr><td>${esc(x.driver_number)}</td><td><b>${esc(x.full_name)}</b></td><td>${esc(x.email||'')}</td><td><span class="badge ${x.pending_activation?'pending':'active'}">${x.pending_activation?'PENDING':'ACTIVE'}</span></td><td>${x.pending_activation?`<button class="btn green act" data-id="${x.id}">ACTIVATE</button>`:'—'}</td></tr>`).join('');$('#v').innerHTML=`<h1>Drivers</h1><div class="toolbar"><button class="btn blue" id="impDrivers">IMPORT DRIVERS</button></div><div class="panel"><h2>Add Driver</h2><div class="g3"><div class="f"><label>FULL NAME</label><input id="dnm"></div><div class="f"><label>EMAIL</label><input id="dem"></div><div class="f"><label>PHONE</label><input id="dph"></div></div><button class="btn green" id="dadd" style="margin-top:12px">ADD DRIVER</button><div id="dm" hidden></div></div><div class="panel"><h2>Driver Roster</h2><div class="table"><table><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan="5">No drivers yet.</td></tr>'}</table></div></div>`;$('#impDrivers').onclick=()=>show('imports');$('#dadd').onclick=async()=>{try{const x=await core('driver_create',{full_name:$('#dnm').value,email:$('#dem').value,phone:$('#dph').value});note('dm',`Driver ${x.driver.driver_number} created. Temporary PIN: ${x.temporary_pin}`,'ok');setTimeout(()=>show('drivers'),1200)}catch(e){note('dm',e.message,'err')}};document.querySelectorAll('.act').forEach(b=>b.onclick=async()=>{await core('driver_set_active',{driver_id:b.dataset.id,active:true});show('drivers')})}
async function entities(){const j=await core('entities_list',{limit:500});const rows=j.entities.map(x=>`<tr><td>${esc(x.entity_type)}</td><td><b>${esc(x.company_name)}</b><br><span class="small">${esc(x.contact_name||'')}</span></td><td>${esc(x.address||'')}</td><td>${esc(x.email||'')}</td><td><span class="badge">${esc(x.location_status)}</span></td></tr>`).join('');$('#v').innerHTML=`<h1>Customers / Vendors</h1><div class="toolbar"><button class="btn blue" id="impEnt">IMPORT RECORDS</button></div><div class="panel"><h2>Add Record</h2><div class="g3"><div class="f"><label>COMPANY</label><input id="en"></div><div class="f"><label>TYPE</label><select id="et"><option>CUSTOMER</option><option>VENDOR</option><option>BOTH</option><option>PROSPECT</option></select></div><div class="f"><label>CONTACT</label><input id="ec"></div></div><div class="g3"><div class="f"><label>PHYSICAL ADDRESS</label><input id="ea"></div><div class="f"><label>EMAIL</label><input id="ee"></div><div class="f"><label>PHONE</label><input id="ep"></div></div><button class="btn green" id="es" style="margin-top:12px">SAVE + GEOCODE</button><div id="em" hidden></div></div><div class="panel"><h2>Master Records</h2><div class="table"><table><tr><th>Type</th><th>Company / Contact</th><th>Address</th><th>Email</th><th>Location</th></tr>${rows||'<tr><td colspan="5">No customer/vendor records yet.</td></tr>'}</table></div></div>`;$('#impEnt').onclick=()=>show('imports');$('#es').onclick=async()=>{try{note('em','Saving and geocoding…');await core('entity_save',{company_name:$('#en').value,entity_type:$('#et').value,contact_name:$('#ec').value,address:$('#ea').value,email:$('#ee').value,phone:$('#ep').value});note('em','Record saved.','ok');setTimeout(()=>show('entities'),700)}catch(e){note('em',e.message,'err')}}}
async function dispatch(){
 const [o,d,l]=await Promise.all([route('orders_list',{statuses:['UNASSIGNED','ROUTED','OUT_FOR_DELIVERY']}),core('drivers_list'),core('locations_list')]);
 const ds=d.drivers.filter(x=>x.active&&!x.pending_activation),locations=l.locations||[],available=o.orders.filter(x=>x.status==='UNASSIGNED');
 let selectedDrivers=new Set(),driverLocations={};
 const rows=o.orders.map(x=>'<tr><td>'+(x.status==='UNASSIGNED'?'<input class="pick" type="checkbox" value="'+esc(x.id)+'">':'—')+'</td><td>'+esc(x.priority)+'</td><td><b>'+esc(x.customer_name)+'</b></td><td>'+esc(x.address)+'</td><td>'+esc(x.status)+'</td></tr>').join('');
 $('#v').innerHTML='<h1>Dispatch</h1>'+
  '<div class="panel"><h2>Add Stop</h2><div class="g3"><div class="f"><label>STOP / COMPANY</label><input id="sn"></div><div class="f"><label>ADDRESS</label><input id="sa"></div><div class="f"><label>SERVICE MINUTES</label><input id="ssvc" type="number" min="0" max="180" value="'+Number(company.default_service_minutes??10)+'"></div><div class="f"><label>PRIORITY</label><select id="sp"><option>NORMAL</option><option>PRIORITY</option><option>HOT_SHOT</option><option>MUST_FIRST</option></select></div></div><button class="btn green" id="sadd" style="margin-top:12px">ADD STOP + GEOCODE</button><div id="sm2" hidden></div></div>'+
  '<div class="panel"><h2>Automatic Multi-Driver Route Builder</h2><div class="note"><b>OFFICE ONLY UNTIL RELEASED:</b> Creating a route does not show it to the driver or start GPS. A driver can have multiple planned routes, with only one ongoing route at a time.</div><div class="sub">Choose who is driving, choose a start / return location for each driver, select the deliveries, then optimize. The system assigns stops across the selected drivers automatically.</div>'+
  '<div class="toolbar"><button class="btn ghost" id="clearDrv">CLEAR DRIVER QUEUE</button><button class="btn ghost" id="allStops">SELECT ALL AVAILABLE STOPS</button><button class="btn ghost" id="clearStops">CLEAR STOPS</button></div>'+
  '<h3 style="margin-top:14px">Drivers</h3><div id="driverPicks" class="driverPickGrid">'+ds.map(x=>'<button class="driverPick" data-id="'+esc(x.id)+'"><b>'+esc(x.full_name)+'</b><div class="small">DRIVER '+esc(x.driver_number)+'</div></button>').join('')+'</div>'+
  '<h3 style="margin-top:14px">Driver Queue</h3><div id="driverQueue" class="driverQueue"><div class="sub">No drivers selected.</div></div>'+
  '<div class="g2"><div class="f"><label>ROUTE DATE</label><input id="routeDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="f"><label>WAVE / LABEL</label><input id="wave" value="STANDARD"></div></div>'+
  '<button class="btn blue" id="optAssign" style="margin-top:12px">OPTIMIZE & PRE-ROUTE</button><div id="routeBuildMsg" hidden></div><div id="routeBuildResult"></div></div>'+
  '<div class="panel"><h2>Dispatch Queue</h2><div class="sub">'+available.length+' AVAILABLE stop(s)</div><div class="table"><table><tr><th></th><th>Priority</th><th>Stop</th><th>Address</th><th>Status</th></tr>'+(rows||'<tr><td colspan="5">No open stops.</td></tr>')+'</table></div></div>';

 function drawQueue(){
  const q=$('#driverQueue'),sel=ds.filter(x=>selectedDrivers.has(x.id));
  q.innerHTML=sel.length?sel.map(x=>{
   const loc=driverLocations[x.id]||'';
   const options=locations.map(z=>'<option value="'+esc(z.id)+'" '+(z.id===loc?'selected':'')+'>'+esc(z.name)+(z.is_primary?' — PRIMARY':'')+'</option>').join('');
   return '<div class="driverQueueRow"><div><b>'+esc(x.full_name)+'</b><div class="small">DRIVER '+esc(x.driver_number)+'</div></div><select data-driver="'+esc(x.id)+'" class="'+(loc?'':'missing')+'"><option value="">— SELECT START / RETURN LOCATION —</option>'+options+'</select></div>';
  }).join(''):'<div class="sub">No drivers selected.</div>';
  q.querySelectorAll('select[data-driver]').forEach(s=>s.onchange=()=>{driverLocations[s.dataset.driver]=s.value;s.classList.toggle('missing',!s.value)});
 }

 document.querySelectorAll('.driverPick').forEach(b=>b.onclick=()=>{
  const id=b.dataset.id;
  if(selectedDrivers.has(id)){selectedDrivers.delete(id);delete driverLocations[id]}else{selectedDrivers.add(id);driverLocations[id]=''}
  b.classList.toggle('on',selectedDrivers.has(id));drawQueue();
 });
 $('#clearDrv').onclick=()=>{selectedDrivers.clear();driverLocations={};document.querySelectorAll('.driverPick').forEach(x=>x.classList.remove('on'));drawQueue()};
 $('#allStops').onclick=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=true);
 $('#clearStops').onclick=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=false);
 $('#sadd').onclick=async()=>{try{note('sm2','Locating address…');await route('order_create',{customer_name:$('#sn').value,address:$('#sa').value,priority:$('#sp').value,service_minutes:Number($('#ssvc').value)});note('sm2','Stop added.','ok');setTimeout(()=>show('dispatch'),500)}catch(e){note('sm2',e.message,'err')}};
 $('#optAssign').onclick=async()=>{
  const btn=$('#optAssign');
  try{
   const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);
   if(!selectedDrivers.size)throw Error('Choose at least one driver.');
   if(!ids.length)throw Error('Select at least one AVAILABLE stop.');
   const selections=[...selectedDrivers].map(id=>({driver_id:id,location_id:driverLocations[id]||''}));
   if(selections.some(x=>!x.location_id))throw Error('Choose a start / return location for every selected driver.');

 app.innerHTML='<div class="driverShell"><div class="panel"><h1>'+esc(company.name)+'</h1><div class="sub">Driver '+esc(me.driver_number)+' • '+esc(me.full_name)+' • '+(gpsEdition?'GPS edition':'Standard edition')+'</div><div class="toolbar"><button class="btn blue" id="drvRoute">MY ROUTES</button><button class="btn ghost" id="drvDispatch">DISPATCH CHAT</button><button class="btn ghost" id="drvDrivers">DRIVER CHAT</button><button class="btn ghost" id="drvOut">SIGN OUT</button></div><div id="driverGPS" class="sub">'+(gpsEdition?'GPS stays off until you start or continue an ACTIVE route.':'Standard edition — no live GPS tracking.')+'</div></div><div id="dv"></div></div>';

function stopGPS(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;trackingRoute=null;if($('#driverGPS'))$('#driverGPS').textContent=gpsEdition?'GPS is off.':'Standard edition — no live GPS tracking.'}
function startGPS(active){
 if(!driverView||me?.role!=='DRIVER'||!gpsEdition||active?.status!=='ACTIVE'||active.driver_user_id!==me.id)return;
 if(gpsWatch!==null&&trackingRoute?.id===active.id)return;stopGPS();trackingRoute=active;
 if(!navigator.geolocation){if($('#driverGPS'))$('#driverGPS').textContent='GPS is unavailable on this device.';return}
 gpsWatch=navigator.geolocation.watchPosition(async pos=>{if(!trackingRoute||trackingRoute.status!=='ACTIVE')return;currentGPS={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy_m:pos.coords.accuracy,speed_mps:pos.coords.speed,heading:pos.coords.heading};try{await route('location_update',{...currentGPS,route_id:trackingRoute.id,source:'WEB_DRIVER'});if($('#driverGPS'))$('#driverGPS').textContent='LIVE GPS • updated '+new Date().toLocaleTimeString()}catch(e){if(e.status===409)stopGPS();else if($('#driverGPS'))$('#driverGPS').textContent='GPS upload delayed. Check your connection.'}},e=>{if($('#driverGPS'))$('#driverGPS').textContent='GPS: '+e.message},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
async function driverRoute(routeId){
 const epoch=++viewEpoch;currentView='driver-route';UDPRouteMap.destroy();
 const j=await route('routes_list',{statuses:['PLANNED','ACTIVE','PAUSED']});if(epoch!==viewEpoch)return;
 const list=(j.routes||[]).slice().sort((a,b)=>Number(['ACTIVE','PAUSED'].includes(b.status))-Number(['ACTIVE','PAUSED'].includes(a.status))||String(a.route_date).localeCompare(String(b.route_date))||String(a.created_at).localeCompare(String(b.created_at)));
 if(trackingRoute&&!list.some(r=>r.id===trackingRoute.id&&r.status==='ACTIVE'))stopGPS();
 routeListVersion=JSON.stringify((j.routes||[]).map(r=>[r.id,r.status,r.updated_at]));
 const r=(routeId?list.find(x=>x.id===routeId):null)||list[0];
 const queue='<div class="panel"><h2>My released routes</h2><div class="sub">Office-only routes stay hidden. You choose when to START.</div>'+list.map(x=>'<div class="routeStop"><b>'+esc(x.route_date)+' • '+esc(x.start_name||'Start location')+'</b><div class="sub">'+esc(releaseText(x))+' • '+esc(x.wave)+'</div><button class="btn ghost pickDriverRoute" data-id="'+esc(x.id)+'">'+(x.id===r?.id?'VIEWING THIS ROUTE':'OPEN ROUTE')+'</button></div>').join('')+'</div>';
 if(!r){currentRoute=null;$('#dv').innerHTML=queue+'<div class="panel"><h2>No released route</h2><div class="sub">Dispatch has not released a route to your driver number yet.</div></div>';return}
 const d=await route('route_get',{route_id:r.id});if(epoch!==viewEpoch)return;currentRoute=d.route;const active=d.route.status==='ACTIVE',paused=d.route.status==='PAUSED',stops=d.stops||[],next=stops.find(x=>['PENDING','ARRIVED'].includes(x.status)),model=UDPRouteMap.model(d.route,stops);
 let controls=r.status==='PLANNED'?'<button class="btn green" id="startR">START ROUTE</button>':paused?'<button class="btn green" id="resumeR">RESUME ROUTE</button>':'<button class="btn ghost" id="pauseR">PAUSE ROUTE</button>';
 if(active&&gpsEdition&&!(gpsWatch!==null&&trackingRoute?.id===r.id))controls+='<button class="btn green" id="continueGPS">CONTINUE ROUTE + GPS</button>';
 if(active&&next)controls+='<button class="btn blue" id="navR">NAVIGATE NEXT</button>';
 $('#dv').innerHTML=queue+((j.offline||d.offline)?'<div class="note">OFFLINE — showing a saved ongoing route. Reconnect before recording delivery outcomes.</div>':'')+'<div class="panel"><h2>'+esc(r.status)+' ROUTE</h2><div class="sub">'+esc(r.start_name||'Start location')+' • '+stops.length+' stop(s)</div><div class="toolbar">'+controls+'</div>'+routeMetricsHTML(d.route)+UDPRouteMap.markup()+'<h2>START — '+esc(model.start.name)+'</h2><div class="sub">'+esc(model.start.address)+'</div>'+stops.map((st,i)=>{const o=st.delivery_orders||{},actionable=active&&next?.id===st.id;return '<div class="routeStop '+(next?.id===st.id?'current':'')+'"><button class="routeFocus" data-index="'+(i+1)+'">STOP '+esc(st.stop_sequence)+' — '+esc(o.customer_name||'')+'</button><div class="sub">'+esc(o.address||'')+' • '+esc(st.status)+' • '+esc(o.priority||'NORMAL')+' • '+esc((o.stop_type||'STOP').replaceAll('_',' '))+'</div>'+(actionable?'<div class="toolbar"><button class="btn ghost arrive" data-id="'+esc(st.id)+'">ARRIVED</button><button class="btn green done" data-id="'+esc(st.id)+'">DELIVERED</button><button class="btn red fail" data-id="'+esc(st.id)+'">NOT DELIVERED</button></div>':'')+'</div>'}).join('')+'<h2 style="margin-top:14px">'+(model.end?'RETURN — '+esc(model.end.name):'END AT LAST STOP')+'</h2><div class="sub">'+esc(model.end?.address||'No return leg assigned.')+'</div></div><div id="navPanel"></div>';
 document.querySelectorAll('.pickDriverRoute').forEach(b=>b.onclick=()=>driverRoute(b.dataset.id).catch(e=>alert(e.message)));document.querySelectorAll('.routeFocus').forEach(b=>b.onclick=()=>UDPRouteMap.focus(Number(b.dataset.index)));
 const run=fn=>async()=>{try{await fn()}catch(e){alert(e.message)}};
 if($('#startR'))$('#startR').onclick=run(async()=>{const started=await route('route_start',{route_id:r.id});await driverRoute(r.id);startGPS(started.route)});
 if($('#continueGPS'))$('#continueGPS').onclick=()=>startGPS(d.route);
 if($('#pauseR'))$('#pauseR').onclick=run(async()=>{const reason=prompt('Pause reason:');if(reason===null)return;await route('route_pause',{route_id:r.id,reason:reason.trim()||'Driver pause'});if(trackingRoute?.id===r.id)stopGPS();await driverRoute(r.id)});
 if($('#resumeR'))$('#resumeR').onclick=run(async()=>{const resumed=await route('route_resume',{route_id:r.id});await driverRoute(r.id);startGPS(resumed.route)});
 if($('#navR'))$('#navR').onclick=run(()=>navigateTo(next));
 document.querySelectorAll('.arrive').forEach(b=>b.onclick=run(async()=>{await route('stop_arrive',{route_stop_id:b.dataset.id});await driverRoute(r.id)}));
 document.querySelectorAll('.done').forEach(b=>b.onclick=run(async()=>{const receiver=prompt('Receiver name (optional):');if(receiver===null)return;const noteText=prompt('Delivery note (optional):');if(noteText===null)return;await route('stop_complete',{route_stop_id:b.dataset.id,note:noteText,pod:{receiver_name:receiver,note:noteText,lat:currentGPS?.lat,lon:currentGPS?.lon}});await driverRoute(r.id)}));
 document.querySelectorAll('.fail').forEach(b=>b.onclick=run(async()=>{const reason=prompt('Why was this not delivered?');if(reason===null)return;await route('stop_not_delivered',{route_stop_id:b.dataset.id,note:reason.trim()||'Not delivered'});await driverRoute(r.id)}));
 UDPRouteMap.render(model,roadLeg);
}

async function navigateTo(s){if(!currentRoute||currentRoute.status!=='ACTIVE')return alert('Start or resume the route before navigating.');if(!currentGPS&&navigator.geolocation)currentGPS=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),e=>reject(Error(e.message)),{enableHighAccuracy:true,timeout:12000}));if(!currentGPS)return alert('GPS is unavailable.');const o=s.delivery_orders||{};const j=await route('navigation',{points:[currentGPS,{lat:o.lat,lon:o.lon}]});$('#navPanel').innerHTML=`<div class="panel"><div class="turn">${esc(j.steps[0]?.maneuver?.instruction||j.steps[0]?.name||'Follow route')}</div><div class="sub">${(j.distance_m/1609.344).toFixed(1)} mi • ${Math.round(j.duration_s/60)} min</div><div id="navMap" class="map"></div></div>`;const m=L.map('navMap').setView([currentGPS.lat,currentGPS.lon],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);const coords=j.geometry.coordinates.map(x=>[x[1],x[0]]);L.polyline(coords,{weight:6}).addTo(m);L.marker([o.lat,o.lon]).addTo(m);m.fitBounds(coords,{padding:[30,30]});const txt=j.steps[0]?.maneuver?.instruction||j.steps[0]?.name;if(txt&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(txt))}}
async function driverDispatchChat(){const t=await core('chat_dispatch_thread');await renderDriverPlainChat(t.thread_id,'Dispatch')}
async function renderDriverPlainChat(tid,title){const draw=async()=>{const j=await core('chat_messages',{thread_id:tid});$('#dv').innerHTML=`<div class="panel"><h2>${esc(title)}</h2><div class="chatbox">${j.messages.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(m.body_plaintext||'')}</div>`).join('')}</div><div class="toolbar"><input id="dt" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn blue" id="ds">SEND</button></div></div>`;$('#ds').onclick=async()=>{const body=$('#dt').value.trim();if(!body)return;await core('chat_send',{thread_id:tid,body});draw()}};await draw()}
async function ensureDriverKey(){let raw=localStorage.getItem('udp_e2ee_key_'+me.id);if(raw){const x=JSON.parse(raw);return {privateKey:await crypto.subtle.importKey('jwk',x.privateKey,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey']),publicJwk:x.publicKey}}const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']),priv=await crypto.subtle.exportKey('jwk',kp.privateKey),pub=await crypto.subtle.exportKey('jwk',kp.publicKey);localStorage.setItem('udp_e2ee_key_'+me.id,JSON.stringify({privateKey:priv,publicKey:pub}));await core('e2ee_public_key_set',{public_key:pub});return {privateKey:kp.privateKey,publicJwk:pub}}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sharedKey(priv,pubJwk){const pub=await crypto.subtle.importKey('jwk',pubJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function driverPrivateList(){if(!company.driver_chat_enabled){$('#dv').innerHTML='<div class="note err">Private Driver-to-Driver messaging is disabled by Dispatch/Admin.</div>';return}await ensureDriverKey();const d=await core('drivers_list');const others=d.drivers.filter(x=>x.id!==me.id&&x.active&&!x.pending_activation&&x.messaging_enabled);$('#dv').innerHTML=`<div class="panel"><h2>Private Driver Chat</h2><div class="sub">End-to-end encrypted direct messages. Dispatch cannot retrieve these conversations.</div><div class="tabs">${others.map(x=>`<button class="pdrv" data-id="${x.id}">${esc(x.full_name)} (${esc(x.driver_number)})</button>`).join('')}</div></div>`;document.querySelectorAll('.pdrv').forEach(b=>b.onclick=()=>openPrivate(b.dataset.id))}
async function openPrivate(otherId){const key=await ensureDriverKey(),t=await core('chat_driver_direct_open',{driver_id:otherId}),other=t.other_driver;if(!other.e2ee_public_key){$('#dv').innerHTML='<div class="note err">That driver has not initialized private chat on their device yet.</div>';return}const k=await sharedKey(key.privateKey,other.e2ee_public_key);const draw=async()=>{const j=await core('chat_messages',{thread_id:t.thread_id}),msgs=[];for(const m of j.messages){let text='[Encrypted message unavailable]';try{const iv=unb64(m.cipher_iv),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,unb64(m.cipher_text));text=new TextDecoder().decode(plain)}catch{}msgs.push(`<div class="msg ${m.sender_id===me.id?'mine':''}">${esc(text)}</div>`)}$('#dv').innerHTML=`<div class="panel"><h2>${esc(other.full_name)}</h2><div class="sub">PRIVATE • END-TO-END ENCRYPTED</div><div class="chatbox">${msgs.join('')}</div><div class="toolbar"><input id="pt" style="flex:1;padding:10px;border:1px solid #d0d5dd;border-radius:9px"><button class="btn blue" id="ps">SEND</button></div></div>`;$('#ps').onclick=async()=>{const text=$('#pt').value.trim();if(!text)return;const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));await core('chat_send',{thread_id:t.thread_id,cipher_text:b64(cipher),cipher_iv:b64(iv),crypto_meta:{alg:'ECDH-P256/AES-GCM',sender_public_key:key.publicJwk,recipient_public_key:other.e2ee_public_key}});draw()}};await draw()}
