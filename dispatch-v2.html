<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>NWTB Dispatch Operations V2 — Multi-Driver Optimizer</title></head><body><div style="font-family:Arial,sans-serif;padding:24px">Loading Dispatch Operations…</div><script>
(async()=>{
 const base='https://raw.githubusercontent.com/billyjwiorek-tech/nwtb-route-creator/397bb72eefd91f891f540dbe3cc85f6e35ea0951/dispatch.html';
 try{
  const r=await fetch(base,{cache:'no-store'});
  if(!r.ok)throw Error('Could not load Dispatch workspace.');
  let html=await r.text();
  const v2OldUse="function useResult(i,saved){const r=window['_search_'+i];if(!r)return;const address=r.address||[r.addr1,r.addr2,r.city,r.state].filter(Boolean).join(', ');$('stopName').value=r.name||'';$('sourceRef').value=r.source_ref||r.customer_number||r.vendor_id||'';$('address').value=address;$('phone').value=r.phone||r.phone_work||r.phone_home||'';$('sourceType').value=r.source_type||($('dirKind').value==='VENDOR'?'VENDOR':'CUSTOMER');$('savedLocationId').value=saved?r.id||'':'';$('lat').value=validCoord(r.lat,r.lon)?r.lat:'';$('lon').value=validCoord(r.lat,r.lon)?r.lon:''}\n";
  const v2NewUse="async function useResult(i,saved){\n if(window.__nwtbV2UseLocationBusy)return;\n const r=window['_search_'+i];if(!r)return;\n window.__nwtbV2UseLocationBusy=true;\n const btn=document.activeElement&&document.activeElement.tagName==='BUTTON'?document.activeElement:null;\n const oldText=btn?btn.textContent:'';\n try{\n  if(btn){btn.disabled=true;btn.textContent='ADDING…'}\n  const address=r.address||[r.addr1,r.addr2,r.city,r.state].filter(Boolean).join(', ');\n  const sourceType=r.source_type||($('dirKind').value==='VENDOR'?'VENDOR':'CUSTOMER');\n  let stopType=$('stopType').value||'CUSTOMER_DELIVERY';\n  if(sourceType==='VENDOR'&&stopType==='CUSTOMER_DELIVERY')stopType='VENDOR_PICKUP';\n  let lat=validCoord(r.lat,r.lon)?Number(r.lat):null,lon=validCoord(r.lat,r.lon)?Number(r.lon):null;\n  if((lat===null||lon===null)&&address){\n   try{const g=await post(API,{action:'geocode',address});if(validCoord(g.lat,g.lon)){lat=Number(g.lat);lon=Number(g.lon)}}catch{}\n  }\n  await post(API,{\n   action:'order_create',\n   stop_type:stopType,\n   source_type:sourceType,\n   source_ref:r.source_ref||r.customer_number||r.vendor_id||null,\n   saved_location_id:saved?(r.id||null):null,\n   sales_order_no:null,\n   reference_no:null,\n   customer_number:sourceType==='CUSTOMER'?(r.source_ref||r.customer_number||null):null,\n   customer_name:r.name||'Unnamed Location',\n   address:address||'ADDRESS NEEDS VERIFICATION',\n   phone:r.phone||r.phone_work||r.phone_home||'',\n   pieces:1,\n   priority:'NORMAL',\n   promised_by:null,\n   notes:'Added directly from V2 USE LOCATION',\n   lat:lat,\n   lon:lon\n  });\n  showBanner('addMsg',(r.name||'Location')+' added directly to the AVAILABLE Dispatch Queue.','ok');\n  $('searchResults').innerHTML='';\n  $('dirQ').value='';\n  await refreshAll();\n  try{setQueue('AVAILABLE',document.querySelector('.filter.active')||undefined)}catch{}\n  const q=document.querySelector('#ordersBody');\n  if(q)q.scrollIntoView({behavior:'smooth',block:'start'});\n }catch(e){\n  showBanner('addMsg','Could not add location to queue: '+(e?.message||e),'err');\n }finally{\n  if(btn){btn.disabled=false;btn.textContent=oldText||'USE LOCATION'}\n  window.__nwtbV2UseLocationBusy=false;\n }\n}\n";
  if(!html.includes(v2OldUse))throw Error('V2 USE LOCATION queue patch could not be applied.');
  html=html.replace(v2OldUse,v2NewUse);
  const extras='<script src="dispatch-patch.js?v=20260925-1135"><\/script><script src="unified-search.js?v=20260923-0835"><\/script><script src="custom-stop.js?v=20260923-0835"><\/script><script src="custom-geocode-fallback-live.js?v=20260924-0815"><\/script><script src="custom-route-fallback.js?v=20260923-0835"><\/script><script src="custom-master-search.js?v=20260923-0835"><\/script><script src="smart-route-live.js?v=20260929-1545"><\/script><script src="custom-endpoints.js?v=20260925-0915"><\/script><script src="custom-return-choice-live.js?v=20260923-1525"><\/script><script src="custom-route-auto-optimize-live.js?v=20260928-0835"><\/script><script src="clear-routes.js?v=20260925-1135"><\/script><script src="route-delete-ui.js?v=20260923-0835"><\/script><script src="delete-selected.js?v=20260923-0835"><\/script><script src="route-toolbar-cleanup.js?v=20260923-0835"><\/script><script src="queue-navigation.js?v=20260923-0835"><\/script><script src="office-pause-alerts.js?v=20260923-0835"><\/script><script src="back-operations.js?v=20260923-0835"><\/script><script src="dispatch-driver-safety.js?v=20260923-0758"><\/script><script src="dispatch-chat-live.js?v=20260924-0900"><\/script><script src="dispatch-change-pin-live.js?v=20260925-1135"><\/script><script src="dispatch-priority-live.js?v=20260928-0805"><\/script><script src="dispatch-roles-live.js?v=20260929-1325"><\/script><script src="dispatch-audit-live.js?v=20260929-1340"><\/script><script src="dispatch-pod-live.js?v=20260930-0835"><\/script><script src="dispatch-health-live.js?v=20260929-1450"><\/script><script src="dispatch-profiles-live.js?v=20260929-1615"><\/script><script src="dispatch-tools-hub-live.js?v=20260930-0842"><\/script><script src="nwtb-system-lock-live.js?v=20260929-1200"><\/script>';
  html=html.replace('</body>',extras+'</body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;color:#b42318"><b>Dispatch failed to load.</b><br>'+e.message+'</div>'}
})();
</script></body></html>
